              money(m.suggestMonthly) + '/мес под ~' + Math.round(RATE * 100) + '% годовых. Вот как это могло бы расти:</div>' +
            '<div class="km-wm-proj">' + projHtml(m) + '</div>' +
            '<div class="km-wm-p muted">Цифры \u2014 иллюстрация при ~' + Math.round(RATE * 100) + '% в год, а не обещание. ' +
              'Реальная доходность колеблется и бывает отрицательной. Зелёным \u2014 рост сверх вложенного.</div>' +
          '</div>' +

          // лестница вариантов
          '<div class="km-wm-c">' +
            '<div class="km-wm-sect">\uD83E\uDE9C От тихого к растущему</div>' +
            '<div class="km-wm-p muted">Слева направо растёт и возможная доходность, и риск. ' +
              'Точки \u2014 примерный уровень риска.</div>' +
            '<div class="km-wm-lad">' + ladderHtml() + '</div>' +
          '</div>' +

          // правила
          '<div class="km-wm-c">' +
            '<div class="km-wm-sect">\uD83E\uDDED Несколько правил</div>' +
            '<ul class="km-wm-rules">' +
              '<li><b>Сначала подушка.</b> Инвестируем только то, что не понадобится в ближайшие 1\u20132 года.</li>' +
              '<li><b>Риск = доходность.</b> Больше обещанного процента \u2014 больше шанс потерять. «Без риска и быстро» \u2014 почти всегда обман.</li>' +
              '<li><b>Раскладывай по корзинам.</b> Не вкладывай всё в одно \u2014 диверсификация сглаживает просадки.</li>' +
              '<li><b>Думай вдолгую.</b> Время и регулярность работают лучше попыток угадать момент.</li>' +
            '</ul>' +
          '</div>' +

          // словарик
          '<div class="km-wm-c">' +
            '<div class="km-wm-sect">\uD83D\uDCD6 Коротко о словах</div>' +
            '<div class="km-wm-gl">' +
              '<div class="row"><span class="t">Купон</span><span class="d">регулярная выплата по облигации \u2014 как процент по вкладу.</span></div>' +
              '<div class="row"><span class="t">Диверсификация</span><span class="d">«не класть все яйца в одну корзину» \u2014 разные активы вместе.</span></div>' +
              '<div class="row"><span class="t">Сложный процент</span><span class="d">доход начинает приносить доход \u2014 рост ускоряется со временем.</span></div>' +
              '<div class="row"><span class="t">Ликвидность</span><span class="d">как быстро можно превратить актив обратно в деньги без потерь.</span></div>' +
            '</div>' +
          '</div>' +

          // CTA
          '<div class="km-wm-cta">' +
            '<button class="km-inv-btn" type="button" style="margin-top:0">\u2728 Создать цель «Инвесткопилка»</button>' +
            '<div class="km-wm-foot">Создам цель на ' + money(spec.amount) + ' за ' + spec.months + '\u00A0мес ' +
              '(\u2248 ' + money(spec.monthly) + '/мес). Сумму и срок потом легко поправить. ' +
              'Мотик будит деньги \u2014 не советует продукт и не обещает доход.</div>' +
          '</div>' +

        '</div>' +
      '</div>';

    // обработчики
    var x = back.querySelector(".km-wm-x");
    if (x) x.addEventListener("click", closeWakeMoney);
    back.addEventListener("click", function (e) { if (e.target === back) closeWakeMoney(); });
    var cta = back.querySelector(".km-wm-cta .km-inv-btn");
    if (cta) cta.addEventListener("click", function () { closeWakeMoney(); createInvestGoal(m); });

    return back;
  }

  function openWakeMoney(m) {
    if (document.getElementById(SHEET_ID)) return;
    injectStyles();
    if (!m) { m = cache.profile ? metrics(cache.profile) : metrics({}); }
    var sheet = buildSheet(m);
    document.body.appendChild(sheet);
    try { prevOverflow = document.body.style.overflow; document.body.style.overflow = "hidden"; } catch (e) {}
    keyHandler = function (e) { if (e.key === "Escape" || e.keyCode === 27) closeWakeMoney(); };
    document.addEventListener("keydown", keyHandler);
    var x = sheet.querySelector(".km-wm-x");
    if (x) try { x.focus(); } catch (e) {}
  }

  function closeWakeMoney() {
    var n = document.getElementById(SHEET_ID);
    if (n && n.parentNode) n.parentNode.removeChild(n);
    try { document.body.style.overflow = prevOverflow || ""; } catch (e) {}
    if (keyHandler) { document.removeEventListener("keydown", keyHandler); keyHandler = null; }
  }

  // =====================================================================
  // Создание цели «Инвесткопилка» — заполняем форму приложения и сабмитим.
  // Запасной путь: пишем цель прямо в хранилище и перезагружаем страницу.
  // =====================================================================
  function clickTab(re) {
    var tabs = document.querySelectorAll(".km-tabbar .km-tab, .km-tab");
    for (var i = 0; i < tabs.length; i++)
      if (re.test((tabs[i].textContent || "").trim())) { tabs[i].click(); return true; }
    return false;
  }
  function btnByText(re, mustEnabled) {
    var nodes = document.querySelectorAll(".km-page button, button.km-btn, button");
    for (var i = 0; i < nodes.length; i++) {
      var b = nodes[i];
      if (!re.test((b.textContent || "").trim())) continue;
      if (mustEnabled && b.disabled) continue;
      return b;
    }
    return null;
  }
  function setNativeValue(el, value) {
    try {
      var proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
      Object.getOwnPropertyDescriptor(proto, "value").set.call(el, String(value));
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    } catch (e) { try { el.value = value; } catch (e2) {} }
  }

  var creating = false;
  // Открываем форму создания цели с подсказками — НЕ отправляем автоматически.
  // Сумму и срок пользователь видит и может изменить, затем сам жмёт «Добавить цель».
  function createInvestGoal(m) {
    if (creating) return;
    if (!m) m = cache.profile ? metrics(cache.profile) : metrics({});
    var spec = investGoalSpec(m);
    creating = true;

    var phase = "tab", tries = 0, total = 0;
    var timer = setInterval(function () {
      total++;
      if (total > 80) { clearInterval(timer); creating = false; return; } // ~8с — страховка

      if (phase === "tab") {
        if (!isGoalsTab()) clickTab(/^Цели$/i);
        if (isGoalsTab()) { phase = "open"; tries = 0; }
        else if (++tries > 12) { clearInterval(timer); creating = false; }
        return;
      }

      var titleIn = document.querySelector(".km-page input.km-textin, input.km-textin");
      if (phase === "open") {
        if (titleIn) { phase = "fill"; tries = 0; return; }
        var openBtn = btnByText(/^\+?\s*Цель$/i, false);   // кнопка «Цель» открывает форму
        if (openBtn) openBtn.click();
        if (++tries > 16) { clearInterval(timer); creating = false; } // не открылось — пользователь уже на «Целях», нажмёт «+ Цель» сам
        return;
      }

      if (phase === "fill") {
        if (!titleIn) { if (++tries > 16) { phase = "open"; tries = 0; } return; }
        // подставляем подсказки только в пустые поля; ничего не отправляем
        if (!titleIn.value) setNativeValue(titleIn, spec.title);
        var amtIn = document.querySelector(".km-page .km-inwrap input.km-input, .km-inwrap input.km-input, .km-page input.km-input");
        if (amtIn) {
          var cur = parseInt(String(amtIn.value).replace(/[^\d]/g, ""), 10) || 0;
          if (cur <= 0) setNativeValue(amtIn, spec.amount);
        }
        var rng = document.querySelector('.km-page input[type=range], input[type=range]');
        if (rng && (rng.value === "" || rng.value === rng.getAttribute("value") || rng.value === "6")) setNativeValue(rng, spec.months);
        clearInterval(timer); creating = false;
        toast("Подставил сумму и срок \u2014 поменяй при желании и нажми «Добавить цель»");
        return;
      }
    }, 100);
  }

  // запасной путь: пишем цель прямо в хранилище и перезагружаем
  function fallbackWrite(spec) {
    if (!window.storage) return;
    Promise.resolve()
      .then(function () { return window.storage.get("km:session"); })
      .then(function (sess) {
        var name = sess && parseMaybe(sess.value);
        if (!name) return null;
        return window.storage.get("km:user:" + name).then(function (rec) { return { name: name, rec: rec }; });
      })
      .then(function (ctx) {
        if (!ctx || !ctx.rec || !ctx.rec.value) return;
        var u = parseMaybe(ctx.rec.value);
        if (!u || typeof u !== "object") return;
        if (!Array.isArray(u.goals)) u.goals = [];
        // не плодим дубликаты
        for (var i = 0; i < u.goals.length; i++) {
          if (((u.goals[i] && u.goals[i].title) || "").trim().toLowerCase() === spec.title.toLowerCase()) return;
        }
        u.goals.push({
          id: Math.random().toString(36).slice(2, 9),
          title: spec.title, amount: spec.amount, months: spec.months, saved: 0
        });
        return window.storage.set("km:user:" + ctx.name, JSON.stringify(u)).then(function () {
          toast("Цель «Инвесткопилка» создана \uD83D\uDCB8");
          setTimeout(function () { try { location.reload(); } catch (e) {} }, 350);
        });
      })
      .catch(function () {});
  }

  // лёгкий тост (если в приложении свой — не мешаем, просто всплываем поверх)
  function toast(text) {
    try {
      var t = document.createElement("div");
      t.textContent = text;
      t.style.cssText = "position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:100000;" +
        "background:var(--brand-d,#0C7C50);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:13.5px;" +
        "padding:11px 16px;border-radius:14px;box-shadow:0 12px 30px -12px rgba(12,60,40,.7);max-width:90%;text-align:center;" +
        "animation:km-wm-up .3s ease both";
      document.body.appendChild(t);
      setTimeout(function () { try { t.style.transition = "opacity .3s"; t.style.opacity = "0"; } catch (e) {} }, 2200);
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
    } catch (e) {}
  }

  // экспортируем действия
  window.KmInvest.openWakeMoney = openWakeMoney;
  window.KmInvest.closeWakeMoney = closeWakeMoney;
  window.KmInvest.createInvestGoal = createInvestGoal;

  // ---------- профиль (троттлинг + кэш) ----------
  var cache = { profile: null, at: 0, pending: false };
  function refreshProfile() {
    if (cache.pending || Date.now() - cache.at < 2500) return;
    cache.pending = true;
    Promise.resolve()
      .then(function () { return window.storage.get("km:session"); })
      .then(function (sess) { var name = sess && parseMaybe(sess.value); return name ? window.storage.get("km:user:" + name) : null; })
      .then(function (rec) {
        cache.at = Date.now(); cache.pending = false;
        if (!rec || !rec.value) { cache.profile = null; return; }
        try { var u = parseMaybe(rec.value); cache.profile = (u && u.profile) || null; } catch (e) { cache.profile = null; }
      })
      .catch(function () { cache.pending = false; cache.at = Date.now(); });
  }

  function remove(attr) { var n = document.querySelector('[data-km="' + attr + '"]'); if (n && n.parentNode) n.parentNode.removeChild(n); }

  function sync() {
    if (!window.storage) return;
    injectStyles();
    refreshProfile();

    var p = cache.profile;
    var m = p ? metrics(p) : null;
    var onHome = isHomeTab();
    var fire = m && m.level >= 1;

    // карточку на вкладке «Мотик» больше не показываем; на всякий случай убираем, если осталась от прежней версии
    remove(ENTRY_MOTIK);

    // Главная: карточка советов строго ПОД карточкой диагноза «Что говорит КопиМотик» (и держим её там при ре-рендерах)
    if (onHome && fire) {
      var anchorH = homeAnchorCard();
      if (anchorH) {
        var existsH = document.querySelector('[data-km="' + ENTRY_HOME + '"]');
        if (!existsH || existsH._lvl !== m.level || anchorH.nextSibling !== existsH) {
          remove(ENTRY_HOME);
          var hblock = buildHome(m); hblock._lvl = m.level;
          anchorH.parentNode.insertBefore(hblock, anchorH.nextSibling);
        }
      } else {
        remove(ENTRY_HOME);
      }
    } else {
      remove(ENTRY_HOME);
    }

    // Цели: идея инвест-цели
    if (isGoalsTab() && fire) {
      var page = document.querySelector(".km-page");
      var existsG = document.querySelector('[data-km="' + ENTRY_GOALS + '"]');
      if (page && (!existsG || existsG._lvl !== m.level || !page.contains(existsG))) {
        remove(ENTRY_GOALS);
        var idea = buildGoalsIdea(m); idea._lvl = m.level;
        var first = page.firstElementChild;
        if (first && first.nextElementSibling) page.insertBefore(idea, first.nextElementSibling);
        else page.insertBefore(idea, page.firstChild);
      }
    } else {
      remove(ENTRY_GOALS);
    }

    // «Светофор»: карточку больше не показываем; убираем, если осталась
    remove(ENTRY_CREDIT);
  }

  function start() {
    injectStyles(); sync();
    var scheduled = false;
    function schedule() {
      if (scheduled) return; scheduled = true;
      (window.requestAnimationFrame || function (f) { setTimeout(f, 16); })(function () { scheduled = false; sync(); });
    }
    try { new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
    setInterval(sync, 1000);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
<script>/* km_pace.js: темп целей — реалистичность целей + приоритет подушки */
/* km_pace.js — «Темп целей»: проверка реалистичности целей.
 *
 * Живёт во вкладке «Цели». Берёт профиль и список целей через window.storage,
 * считает свободный остаток в месяц (доход − обязательные − платежи по долгам)
 * и для каждой цели — сколько нужно откладывать в месяц, чтобы успеть в срок,
 * какую долю свободных денег это съедает и реально ли это вообще.
 *
 * Пока подушка не собрана (а отдельной цели на неё нет) — мягко предлагает
 * сделать её целью №1. Это зеркало km_invest, который включается наоборот —
 * когда подушка уже набрана и деньги простаивают.
 *
 * Арифметика — в window.KmPace (metrics).
 */
(function () {
  "use strict";

  // ---------- помощники ----------
  function num(x) { var n = Number(x); return isFinite(n) ? n : 0; }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function money(x) {
    var n = Math.round(num(x)), sign = n < 0 ? "-" : ""; n = Math.abs(n);
    return sign + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00A0") + "\u00A0\u20BD";
  }
  function months(x) { var r = Math.round(num(x) * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }
  function roundTo(x, step) { return Math.max(0, Math.round(num(x) / step) * step); }

  function debtMonthly(p) {
    var d = p && p.debts;
    if (Array.isArray(d) && d.length) return d.reduce(function (s, x) { return s + num(x && x.monthly); }, 0);
    return num(p && p.creditPayments);
  }
  function cushionTarget(p) {
    try {
      if (window.KmDebt && typeof window.KmDebt.cushionTargetMonths === "function") {
        var t = window.KmDebt.cushionTargetMonths(p);
        if (isFinite(t) && t > 0) return t;
      }
    } catch (e) {}
    var st = p && p.incomeStability;
    if (st === "unstable") return 6;
    if (st === "variable") return 4;
    return 3;
  }

  var CUSHION_RE = /\u043f\u043e\u0434\u0443\u0448|\u0440\u0435\u0437\u0435\u0440\u0432|\u0447[\u0451\u0435]\u0440\u043d|emergenc/i; // подушк|резерв|чёрн|emergency

  // оценка одной цели
  function goalPace(g, free) {
    var target = num(g.amount), saved = num(g.saved);
    var monthsPlan = Math.max(Math.round(num(g.months)) || 6, 1);
    var remaining = Math.max(target - saved, 0);
    var progress = target > 0 ? clamp(saved / target * 100, 0, 100) : 0;
    var rawNeed = remaining > 0 ? remaining / monthsPlan : 0;
    var need = remaining > 0 ? Math.max(roundTo(rawNeed, 100), 100) : 0; // не округляем в ноль
    var share = remaining <= 0 ? 0 : (free > 0 ? need / free : Infinity);

    var key, label;
    if (remaining <= 0) { key = "done"; label = "\u0433\u043e\u0442\u043e\u0432\u043e"; }
    else if (free <= 0) { key = "none"; label = "\u043d\u0435\u0442 \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u044b\u0445"; }
    else if (share <= 0.25) { key = "easy"; label = "\u043b\u0435\u0433\u043a\u043e"; }
    else if (share <= 0.5) { key = "real"; label = "\u0440\u0435\u0430\u043b\u044c\u043d\u043e"; }
    else if (share <= 1) { key = "tight"; label = "\u043d\u0430\u043f\u0440\u044f\u0436\u0451\u043d\u043d\u043e"; }
    else { key = "hard"; label = "\u043d\u0435 \u0442\u044f\u043d\u0435\u0448\u044c"; }

    return {
      title: (g.title || "\u0426\u0435\u043b\u044c"), target: target, saved: saved, remaining: remaining,
      monthsPlan: monthsPlan, need: need, share: share, progress: progress,
      key: key, label: label, isCushion: CUSHION_RE.test(g.title || "")
    };
  }

  function metrics(profile, goals) {
    var p = profile || {};
    var income = num(p.income), mandatory = num(p.mandatoryExpenses), payments = debtMonthly(p), savings = num(p.savings);
    var free = income - mandatory - payments;
    var list = Array.isArray(goals) ? goals : [];
    var active = list.filter(function (g) { return num(g.amount) > 0; });
    var paces = active.map(function (g) { return goalPace(g, free); });
    var open = paces.filter(function (x) { return x.remaining > 0; });
    var totalNeed = open.reduce(function (s, x) { return s + x.need; }, 0);
    var shareAll = free > 0 ? totalNeed / free : (totalNeed > 0 ? Infinity : 0);

    var cushionMonths = mandatory > 0 ? savings / mandatory : (savings > 0 ? 12 : 0);
    var target = cushionTarget(p);
    var hasCushionGoal = active.some(function (g) { return CUSHION_RE.test(g.title || ""); });
    var needCushion = cushionMonths < target * 0.95 && !hasCushionGoal;
    var cushionGap = Math.max(target * mandatory - savings, 0);

    return {
      free: free, income: income, mandatory: mandatory, savings: savings,
      paces: paces, open: open, totalNeed: totalNeed, shareAll: shareAll,
      cushionMonths: cushionMonths, target: target, needCushion: needCushion, cushionGap: cushionGap
    };
  }

  window.KmPace = { num: num, money: money, months: months, goalPace: goalPace, metrics: metrics, cushionTarget: cushionTarget };

  // ===================================================================
  if (typeof document === "undefined" || !document.createElement || !document.body) return;

  var ENTRY = "km-pace";

  function injectStyles() {
    if (document.getElementById("km-pace-styles")) return;
    var css = [
      "@keyframes km-pace-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}",
      ".km-pace-wrap{animation:km-pace-rise .35s ease both;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}",

      ".km-pace-card{background:var(--surface,#fff);border:1px solid var(--line,#DCEDE0);border-radius:22px;padding:16px 16px 14px;box-shadow:var(--shadow,0 8px 24px rgba(20,48,37,.10))}",
      ".km-pace-head{display:flex;align-items:center;gap:10px}",
      ".km-pace-head .em{font-size:20px}",
      ".km-pace-title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;color:var(--ink,#143025);line-height:1.1}",
      ".km-pace-free{margin-left:auto;text-align:right;flex-shrink:0}",
      ".km-pace-free .l{font-family:'Nunito',sans-serif;font-weight:800;font-size:10.5px;color:var(--muted,#6E8A78);letter-spacing:.02em}",
      ".km-pace-free .v{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--brand-d,#0C7C50);line-height:1.05}",
      ".km-pace-free .v.neg{color:var(--danger,#E5594E)}",

      ".km-pace-goal{margin-top:12px;background:var(--bg,#EAF5EC);border:1px solid var(--line,#DCEDE0);border-radius:16px;padding:11px 13px}",
      ".km-pace-goal .top{display:flex;align-items:center;gap:8px}",
      ".km-pace-goal .nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14.5px;color:var(--ink,#143025);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}",
      ".km-pace-chip{margin-left:auto;flex-shrink:0;font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;padding:4px 9px;border-radius:999px;white-space:nowrap}",
      ".km-pace-chip.easy,.km-pace-chip.real,.km-pace-chip.done{background:var(--brand-bg,#E3F5EB);color:var(--brand,#16A06A)}",
      ".km-pace-chip.tight{background:var(--tense-bg,#FBF0DA);color:#9a6410}",
      ".km-pace-chip.hard,.km-pace-chip.none{background:#FBE6E3;color:var(--danger,#E5594E)}",
      ".km-pace-bar{height:7px;border-radius:99px;background:var(--bg2,#D6EEDC);margin-top:9px;overflow:hidden}",
      ".km-pace-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand,#16A06A),var(--brand-d,#0C7C50))}",
      ".km-pace-meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}",
      ".km-pace-meta .need{font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;color:var(--ink,#143025)}",
      ".km-pace-meta .need b{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--brand-d,#0C7C50)}",
      ".km-pace-meta .sub{font-family:'Nunito',sans-serif;font-weight:700;font-size:11.5px;color:var(--muted,#6E8A78);text-align:right;flex-shrink:0}",

      ".km-pace-sum{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line,#DCEDE0);font-family:'Nunito',sans-serif;font-weight:700;font-size:12.5px;color:var(--ink,#143025);line-height:1.45}",
      ".km-pace-sum b{font-weight:900;color:var(--brand-d,#0C7C50)}",
      ".km-pace-sum.warn b{color:var(--danger,#E5594E)}",

      ".km-pace-cush{background:linear-gradient(135deg,var(--tense-bg,#FBF0DA),#FCF6E6);border:1.5px solid var(--tense,#EFA838);border-radius:20px;padding:15px 16px;animation:km-pace-rise .35s ease both}",
      ".km-pace-cush .ttl{display:flex;align-items:center;gap:9px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:#8a5a10}",
      ".km-pace-cush .bd{font-family:'Nunito',sans-serif;font-weight:600;font-size:13.5px;color:var(--ink,#143025);line-height:1.5;margin-top:7px}",
      ".km-pace-cush .bd b{font-weight:900;color:#8a5a10}",
      ".km-pace-btn{margin-top:13px;width:100%;border:none;border-radius:16px;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;padding:13px 16px;color:#fff;background:linear-gradient(135deg,#EFA838,#D98E1F);display:flex;align-items:center;justify-content:center;gap:8px}",
      ".km-pace-btn:active{transform:translateY(1px)}",

      "@media (max-width:360px){.km-pace-title{font-size:16px}.km-pace-goal .nm{font-size:13.5px}}"
    ].join("");
    var s = document.createElement("style");
    s.id = "km-pace-styles";
    s.appendChild(document.createTextNode(css));
    (document.head || document.documentElement).appendChild(s);
  }

  // ---------- активная вкладка ----------
  function activeTabText() {
    var on = document.querySelector(".km-tabbar .km-tab.on, .km-tab.on");
    return on ? (on.textContent || "").trim() : "";
  }
  function isGoalsTab() { return /^\u0426\u0435\u043b\u0438$/i.test(activeTabText()); } // Цели

  // ---------- открыть форму добавления цели (как в km_invest) ----------
  function findByText(selectors, re) {
    for (var s = 0; s < selectors.length; s++) {
      var nodes = document.querySelectorAll(selectors[s]);
      for (var i = 0; i < nodes.length; i++) if (re.test((nodes[i].textContent || "").trim())) return nodes[i];
    }
    return null;
  }
  function setNativeValue(el, value) {
    try {
      var proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
      Object.getOwnPropertyDescriptor(proto, "value").set.call(el, value);
      el.dispatchEvent(new Event("input", { bubbles: true }));
      el.dispatchEvent(new Event("change", { bubbles: true }));
    } catch (e) { try { el.value = value; } catch (e2) {} }
  }
  function openAddGoal(title) {
    var btn = findByText([".km-btn", "button"], /\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u0446\u0435\u043b\u044c|\u041d\u043e\u0432\u0430\u044f \u0446\u0435\u043b\u044c/i); // Добавить цель|Новая цель
    if (btn) btn.click();
    var tries = 0, timer = setInterval(function () {
      tries++;
      var input = document.querySelector(".km-page input.km-textin, .km-page textarea.km-textin, .km-page input[type=text]");
      if (input) { setNativeValue(input, title); clearInterval(timer); }
      else if (tries > 12) clearInterval(timer);
    }, 60);
  }

  // ---------- сборка карточек ----------
  function buildCushion(m) {
    var card = document.createElement("div");
    card.className = "km-pace-cush";
    var gapLine = m.cushionGap > 0
      ? "\u0421\u0435\u0439\u0447\u0430\u0441 \u043f\u043e\u0434\u0443\u0448\u043a\u0430 \u2014 <b>" + months(m.cushionMonths) + "\u00A0\u043c\u0435\u0441.</b> \u0438\u0437 " + m.target +
        ". \u0427\u0442\u043e\u0431\u044b \u0437\u0430\u043a\u0440\u044b\u0442\u044c \u0446\u0435\u043b\u044c, \u043d\u0443\u0436\u043d\u043e \u0435\u0449\u0451 <b>" + money(m.cushionGap) + "</b>."
      : "\u041f\u043e\u0434\u0443\u0448\u043a\u0430 \u043f\u043e\u043a\u0430 \u043d\u0435 \u0441\u043e\u0431\u0440\u0430\u043d\u0430.";
    card.innerHTML =
      '<div class="ttl">\uD83D\uDEE1\uFE0F \u0421\u043d\u0430\u0447\u0430\u043b\u0430 \u2014 \u043f\u043e\u0434\u0443\u0448\u043a\u0430</div>' +
      '<div class="bd">' + gapLine + ' \u042d\u0442\u043e \u0446\u0435\u043b\u044c \u2116\u00A01: \u043e\u043d\u0430 \u0432\u0430\u0436\u043d\u0435\u0435 \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u044b\u0445, \u043f\u043e\u0442\u043e\u043c\u0443 \u0447\u0442\u043e \u0437\u0430\u0449\u0438\u0449\u0430\u0435\u0442 \u043e\u0442 \u043d\u043e\u0432\u044b\u0445 \u0434\u043e\u043b\u0433\u043e\u0432, \u0435\u0441\u043b\u0438 \u0447\u0442\u043e-\u0442\u043e \u043f\u043e\u0439\u0434\u0451\u0442 \u043d\u0435 \u0442\u0430\u043a.</div>' +
      '<button class="km-pace-btn" type="button">\u2795 \u0421\u0434\u0435\u043b\u0430\u0442\u044c \u043f\u043e\u0434\u0443\u0448\u043a\u0443 \u0446\u0435\u043b\u044c\u044e</button>';
    var btn = card.querySelector(".km-pace-btn");
    if (btn) btn.addEventListener("click", function () { openAddGoal("\u0424\u0438\u043d\u0430\u043d\u0441\u043e\u0432\u0430\u044f \u043f\u043e\u0434\u0443\u0448\u043a\u0430"); });
    return card;
  }

  function buildPace(m) {
    var card = document.createElement("div");
    card.className = "km-pace-card";

    var rows = m.paces.map(function (x) {
      var sub, need;
      if (x.remaining <= 0) {
        need = "\u0426\u0435\u043b\u044c \u0437\u0430\u043a\u0440\u044b\u0442\u0430 \uD83C\uDF89";
        sub = money(x.target);
      } else {
        need = "\u041d\u0430\u0434\u043e <b>" + money(x.need) + "/\u043c\u0435\u0441</b>";
        if (m.free > 0 && isFinite(x.share)) sub = Math.round(x.share * 100) + "% \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u043e\u0433\u043e \u00B7 \u0441\u0440\u043e\u043a " + x.monthsPlan + "\u00A0\u043c\u0435\u0441.";
        else sub = "\u0441\u0440\u043e\u043a " + x.monthsPlan + "\u00A0\u043c\u0435\u0441.";
      }
      return '<div class="km-pace-goal">' +
        '<div class="top"><div class="nm">' + esc(x.title) + '</div>' +
        '<div class="km-pace-chip ' + x.key + '">' + x.label + '</div></div>' +
        '<div class="km-pace-bar"><i style="width:' + Math.max(x.progress, 2) + '%"></i></div>' +
        '<div class="km-pace-meta"><div class="need">' + need + '</div><div class="sub">' + sub + '</div></div>' +
        '</div>';
    }).join("");

    var sumClass = "km-pace-sum", sumText;
    if (m.open.length === 0) {
      sumText = "\u0412\u0441\u0435 \u0446\u0435\u043b\u0438 \u0437\u0430\u043a\u0440\u044b\u0442\u044b \u2014 \u043a\u0440\u0430\u0441\u0430\u0432\u0447\u0438\u043a! \u041c\u043e\u0436\u043d\u043e \u0441\u0442\u0430\u0432\u0438\u0442\u044c \u043d\u043e\u0432\u0443\u044e.";
    } else if (m.free <= 0) {
      sumClass += " warn";
      sumText = "\u0421\u0432\u043e\u0431\u043e\u0434\u043d\u044b\u0445 \u0434\u0435\u043d\u0435\u0433 \u0441\u0435\u0439\u0447\u0430\u0441 \u043d\u0435\u0442 \u2014 \u0446\u0435\u043b\u0438 \u043f\u0440\u0438\u0434\u0451\u0442\u0441\u044f \u043f\u0440\u0438\u0442\u043e\u0440\u043c\u043e\u0437\u0438\u0442\u044c. \u0421\u043d\u0430\u0447\u0430\u043b\u0430 \u043e\u0441\u0432\u043e\u0431\u043e\u0434\u0438 \u043e\u0441\u0442\u0430\u0442\u043e\u043a: \u043c\u0435\u043d\u044c\u0448\u0435 \u0442\u0440\u0430\u0442 \u0438\u043b\u0438 \u043c\u0435\u043d\u044c\u0448\u0435 \u043f\u043b\u0430\u0442\u0435\u0436\u0435\u0439.";
    } else {
      var pct = Math.round(m.shareAll * 100);
      if (m.shareAll <= 1) {
        sumText = "\u041d\u0430 \u0432\u0441\u0435 \u0446\u0435\u043b\u0438 \u043d\u0443\u0436\u043d\u043e <b>" + money(m.totalNeed) + "/\u043c\u0435\u0441</b> \u2014 \u044d\u0442\u043e " + pct +
          "% \u0442\u0432\u043e\u0435\u0433\u043e \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u043e\u0433\u043e \u043e\u0441\u0442\u0430\u0442\u043a\u0430. \u0418\u0434\u0451\u0448\u044c \u0432 \u0433\u0440\u0430\u0444\u0438\u043a\u0435.";
      } else {
        sumClass += " warn";
        sumText = "\u041d\u0430 \u0432\u0441\u0435 \u0446\u0435\u043b\u0438 \u0441\u0440\u0430\u0437\u0443 \u043d\u0443\u0436\u043d\u043e <b>" + money(m.totalNeed) + "/\u043c\u0435\u0441</b>, \u0430 \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u043e \u0442\u043e\u043b\u044c\u043a\u043e " + money(m.free) +
          ". \u041b\u0443\u0447\u0448\u0435 \u0440\u0430\u0441\u0442\u044f\u043d\u0443\u0442\u044c \u0441\u0440\u043e\u043a\u0438 \u0438\u043b\u0438 \u043e\u0441\u0442\u0430\u0432\u0438\u0442\u044c 1\u20132 \u0433\u043b\u0430\u0432\u043d\u044b\u0435 \u0446\u0435\u043b\u0438.";
      }
    }

    card.innerHTML =
      '<div class="km-pace-head"><span class="em">\uD83C\uDFAF</span>' +
        '<div class="km-pace-title">\u0422\u0435\u043c\u043f \u0446\u0435\u043b\u0435\u0439</div>' +
        '<div class="km-pace-free"><div class="l">\u0421\u0412\u041e\u0411\u041e\u0414\u041d\u041e/\u041c\u0415\u0421</div>' +
          '<div class="v' + (m.free < 0 ? " neg" : "") + '">' + money(m.free) + '</div></div>' +
      '</div>' +
      rows +
      '<div class="' + sumClass + '">' + sumText + '</div>';
    return card;
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // ---------- профиль + цели (троттлинг + кэш) ----------
  var cache = { profile: null, goals: null, at: 0, pending: false };
  function refresh() {
    if (cache.pending || Date.now() - cache.at < 2500) return;
    cache.pending = true;
    Promise.resolve()
      .then(function () { return window.storage.get("km:session"); })
      .then(function (sess) { var name = sess && sess.value; return name ? window.storage.get("km:user:" + name) : null; })
      .then(function (rec) {
        cache.at = Date.now(); cache.pending = false;
        if (!rec || !rec.value) { cache.profile = null; cache.goals = null; return; }
        try { var u = JSON.parse(rec.value); cache.profile = (u && u.profile) || null; cache.goals = (u && u.goals) || []; }
        catch (e) { cache.profile = null; cache.goals = null; }
      })
      .catch(function () { cache.pending = false; cache.at = Date.now(); });
  }

  function remove() { var n = document.querySelector('[data-km="' + ENTRY + '"]'); if (n && n.parentNode) n.parentNode.removeChild(n); }

  function sync() {
    if (!window.storage) return;
    injectStyles();
    refresh();

    if (!isGoalsTab() || !cache.profile) { remove(); return; }

    var m = metrics(cache.profile, cache.goals);
    var hasGoals = m.paces.length > 0;
    if (!hasGoals && !m.needCushion) { remove(); return; }

    // ключ состояния — чтобы перерисовывать только при изменениях
    var sig = JSON.stringify({
      f: Math.round(m.free), n: m.needCushion, g: m.cushionGap,
      p: m.paces.map(function (x) { return [x.title, x.need, x.key, Math.round(x.progress)]; })
    });

    var page = document.querySelector(".km-page");
    if (!page) return;
    var exists = document.querySelector('[data-km="' + ENTRY + '"]');
    if (exists && exists._sig === sig && page.contains(exists)) return;

    remove();
    var wrap = document.createElement("div");
    wrap.className = "km-pace-wrap";
    wrap.setAttribute("data-km", ENTRY);
    wrap._sig = sig;
    if (m.needCushion) wrap.appendChild(buildCushion(m));
    if (hasGoals) wrap.appendChild(buildPace(m));

    // вставляем сразу под первым блоком страницы (как km_invest)
    var first = page.firstElementChild;
    if (first && first.nextElementSibling) page.insertBefore(wrap, first.nextElementSibling);
    else page.insertBefore(wrap, first ? first.nextSibling : page.firstChild);
  }

  function start() {
    injectStyles(); sync();
    var scheduled = false;
    function schedule() {
      if (scheduled) return; scheduled = true;
      (window.requestAnimationFrame || function (f) { setTimeout(f, 16); })(function () { scheduled = false; sync(); });
    }
    try { new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
    setInterval(sync, 1000);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>



<script>/* km_check.js: кнопка «Чек» — быстрый ввод траты (текст / фото / голос) */
/* Плагин не трогает React-бандл: монтирует плавающую кнопку, нижнее окошко
 * выбора и раздел «Чеки» в профиле прямо в DOM, теми же стилями
 * (km-modal / km-sheet / km-btn / km-card). Хранилище — общее window.storage:
 *   km:session   -> JSON-имя пользователя
 *   km:user:<id> -> весь стейт; баланс в profile.savings, чеки в expenses[]
 * Сценарий: получить сумму -> вычесть из баланса -> разобрать суть -> показать итог.
 */
(function () {
  "use strict";

  var CATS = [
    { re: /(такси|метро|автобус|бензин|заправк|транспорт|каршеринг|самокат|проезд)/i, cat: "Транспорт", em: "🚕" },
    { re: /(кафе|ресторан|кофе|обед|ужин|завтрак|пицц|суши|еда|продукт|магазин|супермаркет|пятёроч|перекрёст|ашан|столов)/i, cat: "Еда и продукты", em: "🍔" },
    { re: /(одежд|обув|кроссов|футболк|джинс|куртк|плать|zara|h&m)/i, cat: "Одежда", em: "👕" },
    { re: /(аптек|лекарств|врач|клиник|анализ|стоматолог|здоровь)/i, cat: "Здоровье", em: "💊" },
    { re: /(подписк|netflix|spotify|youtube|игр|кино|развлеч|концерт|клуб)/i, cat: "Развлечения", em: "🎬" },
    { re: /(квартир|аренд|жкх|коммунал|свет|вода|интернет|связь|телефон|жиль)/i, cat: "Жильё и связь", em: "🏠" },
    { re: /(техник|ноутбук|наушник|гаджет|электрон)/i, cat: "Техника", em: "🔌" },
    { re: /(подар|цвет|сувенир)/i, cat: "Подарки", em: "🎁" }
  ];
  function detectCategory(text) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].re.test(text || "")) return CATS[i];
    return { cat: "Прочее", em: "🧾" };
  }

  function parseAmount(text) {
    if (text == null) return 0;
    var t = String(text).replace(/\u00A0/g, " ");
    var m = t.match(/(\d[\d\s.,]*)\s*(?:руб|рубл|р\b|₽|rub)?/gi);
    if (!m) return 0;
    var best = 0;
    for (var i = 0; i < m.length; i++) {
      var cleaned = m[i].replace(/[^\d.,\s]/gi, "").trim()
        .replace(/\s/g, "").replace(/[.,]\d{1,2}$/, "").replace(/[.,]/g, "");
      var n = parseInt(cleaned, 10);
      if (Number.isFinite(n) && n > best) best = n;
    }
    return best || 0;
  }
  function fmtMoney(v) { return Number.isFinite(v) ? Math.round(v).toLocaleString("ru-RU") + " ₽" : "—"; }
  function fmtDate(iso) {
    try { var d = new Date(iso); return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return ""; }
  }
  function jparse(v) { try { return JSON.parse(v); } catch (e) { return v; } }
  function genId() { return "ex_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // --- хранилище приложения ----------------------------------------------
  async function loadUser() {
    if (!window.storage) return null;
    var sess = await window.storage.get("km:session");
    if (!sess || sess.value == null) return null;
    var uid = jparse(sess.value);
    if (!uid || typeof uid !== "string") return null;
    var rec = await window.storage.get("km:user:" + uid);
    if (!rec || rec.value == null) return null;
    var data = jparse(rec.value);
    if (!data || typeof data !== "object") return null;
    if (!Array.isArray(data.expenses)) data.expenses = [];
    return { uid: uid, data: data };
  }
  async function saveUser(uid, data) {
    if (!window.storage) return;
    await window.storage.set("km:user:" + uid, JSON.stringify(data));
  }

  // создать трату: вычесть из баланса (savings), записать историю
  async function applyExpense(amount, note, source) {
    var u = await loadUser();
    if (!u) return { ok: false, reason: "Не удалось получить данные — войди в аккаунт." };
    var data = u.data;
    data.profile = data.profile || {};
    var before = Number(data.profile.savings) || 0;
    var after = before - amount;
    data.profile.savings = after;
    var cat = detectCategory(note || "");
    var entry = {
      id: genId(), amount: amount, note: (note || "").trim(),
      category: cat.cat, em: cat.em, source: source || "text",
      date: new Date().toISOString()
    };
    data.expenses.push(entry);
    await saveUser(u.uid, data);
    return { ok: true, before: before, after: after, entry: entry, income: Number(data.profile.income) || 0 };
  }

  // пересчитать баланс при правке/удалении чека: разница откатывается в savings
  async function editExpense(id, newAmount, newNote) {
    var u = await loadUser(); if (!u) return false;
    var data = u.data; data.profile = data.profile || {};
    var idx = data.expenses.findIndex(function (e) { return e.id === id; });
    if (idx < 0) return false;
    var old = data.expenses[idx];
    var delta = (Number(old.amount) || 0) - (Number(newAmount) || 0); // вернуть в баланс разницу
    data.profile.savings = (Number(data.profile.savings) || 0) + delta;
    old.amount = Number(newAmount) || 0;
    if (newNote != null) { old.note = String(newNote).trim(); var c = detectCategory(old.note); old.category = c.cat; old.em = c.em; }
    await saveUser(u.uid, data); return true;
  }
  async function deleteExpense(id) {
    var u = await loadUser(); if (!u) return false;
    var data = u.data; data.profile = data.profile || {};
    var idx = data.expenses.findIndex(function (e) { return e.id === id; });
    if (idx < 0) return false;
    var old = data.expenses[idx];
    data.profile.savings = (Number(data.profile.savings) || 0) + (Number(old.amount) || 0); // вернуть сумму в баланс

          .catch(function () { showAmount(0, false); status.textContent = "Не удалось распознать — впиши сумму вручную."; });

  // --- ГОЛОС: сразу доступ к микрофону, без ручного текста ----------------
  function showVoice() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var heard = el("div", { class: "km-card", style: "min-height:54px;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-weight:600;font-size:17;text-align:center;color:var(--ink)" }, ["…"]);
    var status = el("div", { style: "font-weight:700;font-size:13.5;min-height:18px;color:var(--brand-d,#0C7C50);text-align:center;margin-top:8px" }, [""]);
    var actions = el("div", { style: "display:flex;flex-direction:column;gap:10;margin-top:12px" }, []);
    var transcript = "";

    function confirmBlock(amt) {
      actions.innerHTML = "";
      var save = el("button", { class: "km-btn primary" }, ["Записать −" + fmtMoney(amt)]);
      save.addEventListener("click", function () { save.disabled = true; save.textContent = "Считаю…"; applyExpense(amt, transcript, "voice").then(showResult); });
      actions.appendChild(save);
      actions.appendChild(el("button", { class: "km-btn ghost", onclick: function () { transcript = ""; heard.textContent = "…"; startListen(); } }, ["🎙️ Сказать заново"]));
    }

    var rec = null, listening = false;
    function micFailed(reason) {
      status.textContent = reason;
      actions.innerHTML = "";
      actions.appendChild(el("button", { class: "km-btn", onclick: startListen }, ["↻ Повторить доступ к микрофону"]));
    }
    function handleText(txt) {
      transcript = txt; heard.textContent = txt || "…";
      var amt = parseAmount(txt);
      if (amt > 0) { status.textContent = "Распознал: " + fmtMoney(amt) + ". Подтверди запись."; confirmBlock(amt); }
      else status.textContent = "Назови сумму, например «продукты тысяча двести».";
    }
    function startListen() {
      if (!SR) { micFailed("Голосовой ввод не поддерживается этим браузером."); return; }
      // явный запрос доступа к микрофону (чтобы показать системный запрос сразу)
      var begin = function () {
        try {
          rec = new SR(); rec.lang = "ru-RU"; rec.interimResults = true; rec.continuous = false;
          rec.onstart = function () { listening = true; status.textContent = "● Слушаю… говори."; actions.innerHTML = ""; actions.appendChild(stopBtn()); };
          rec.onresult = function (ev) { var t = ""; for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript; heard.textContent = t; transcript = t; };
          rec.onerror = function (e) { listening = false; micFailed(e && e.error === "not-allowed" ? "Доступ к микрофону не разрешён. Разреши его в настройках браузера." : "Не удалось распознать — попробуй ещё раз."); };
          rec.onend = function () { listening = false; handleText(transcript); };
          rec.start();
        } catch (e) { micFailed("Не удалось включить микрофон."); }
      };
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
          try { s.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
          begin();
        }).catch(function () { micFailed("Доступ к микрофону не разрешён. Разреши его в настройках браузера."); });
      } else begin();
    }

    mount(el("div", { class: "km-sheet", style: "max-height:80vh;overflow:auto" }, [
      el("div", { style: "display:flex;justify-content:space-between;align-items:center;margin-bottom:12" }, [

        closeBtn(function () { showChooser(); })

  }

  function renderProfileSection(host) {
    var myToken = ++profileRenderToken;
    host.innerHTML = "";
    host.appendChild(el("div", { class: "km-secttl", style: "display:flex;align-items:center;gap:8" }, [
      el("span", { style: "font-size:18" }, ["🧾"]),
      el("span", null, ["Мои чеки"])
    ]));
    var list = el("div", { style: "display:flex;flex-direction:column;gap:10;margin-top:10" }, []);
    host.appendChild(list);
    var rerender = function () { var h = document.getElementById("km-check-profile"); if (h) renderProfileSection(h); };
    getExpenses().then(function (items) {
      if (myToken !== profileRenderToken) return;        // отрисовка устарела — выходим
      if (!document.body.contains(host)) return;          // хост уже отсоединён
      profileSig = expensesSig(items);
      if (!items.length) {
        list.appendChild(el("div", { class: "km-muted", style: "background:var(--bg,#F4FAF5);border-radius:14px;padding:16px;text-align:center;font-weight:700;font-size:14" },
          ["Пока нет чеков. Нажми «🧾 Чек», чтобы записать трату — она появится здесь, и её можно будет изменить."]));
        return;
      }
      var total = items.reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
      list.appendChild(el("div", { style: "display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--brand-bg,#E3F5EB);border-radius:14px" }, [
        el("div", { style: "font-weight:800;font-size:13;color:var(--ink)" }, ["Всего трат: " + items.length]),
        el("div", { style: "font-family:Fredoka;font-weight:700;font-size:16;color:var(--danger,#E5594E)" }, ["−" + fmtMoney(total)])
      ]));
      items.forEach(function (e) { list.appendChild(buildExpenseRow(e, rerender)); });
    });
  }

  // профиль активен? (по подсвеченной вкладке таб-бара)
  function isProfileActive() {
    var tabs = document.querySelectorAll(".km-tab");
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].className.indexOf("on") >= 0 && /Профиль/i.test(tabs[i].textContent || "")) return true;
    }
    return false;
  }
  function syncProfileSection() {
    var existing = document.getElementById("km-check-profile");
    if (isProfileActive()) {
      var page = document.querySelector(".km-page");
      if (!page) return;
      if (existing && page.contains(existing)) {
        // секция на месте — проверим, не изменились ли чеки (правка/удаление/добавление)
        getExpenses().then(function (items) {
          if (!document.body.contains(existing)) return;
          if (expensesSig(items) !== profileSig) renderProfileSection(existing);
        });
        return;
      }
      if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
      profileSig = null;
      var host = el("div", { id: "km-check-profile", class: "km-card", style: "margin-top:14px" }, []);
      page.appendChild(host); // самый низ профиля
      renderProfileSection(host);
    } else if (existing && existing.parentNode) {
      existing.parentNode.removeChild(existing);
      profileSig = null;
    }
  }

  // --- плавающая кнопка «Чек» --------------------------------------------
  function injectStyles() {
    if (document.getElementById("km-check-style")) return;
    var s = document.createElement("style"); s.id = "km-check-style";
    s.textContent =
      ".km-check-fab{position:fixed;right:18px;bottom:96px;z-index:70;display:flex;align-items:center;gap:8px;" +
      "padding:14px 20px;border:none;border-radius:999px;cursor:pointer;font-family:Fredoka,system-ui,sans-serif;" +
      "font-weight:700;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--brand,#16A06A),var(--brand-d,#0C7C50));" +
      "box-shadow:0 12px 28px -8px rgba(12,124,80,.65);animation:kmCheckPop .4s cubic-bezier(.2,.9,.3,1.4) both}" +
      ".km-check-fab:active{transform:scale(.94)}.km-check-fab .em{font-size:20px;line-height:1}" +
      "@keyframes kmCheckPop{from{opacity:0;transform:translateY(14px) scale(.8)}to{opacity:1;transform:none}}" +
      "@media(min-width:520px){.km-check-fab{right:calc(50% - 240px + 18px)}}";
    document.head.appendChild(s);
  }
  function mountFab() {
    if (document.getElementById("km-check-fab")) return;
    injectStyles();
    document.body.appendChild(el("button", { id: "km-check-fab", class: "km-check-fab", onclick: function () { showChooser(); } }, [
      el("span", { class: "em" }, ["🧾"]), el("span", null, ["Чек"])
    ]));
  }

  function removeProfileSection() {
    var ps = document.getElementById("km-check-profile");
    if (ps && ps.parentNode) ps.parentNode.removeChild(ps);
    profileSig = null;
  }

  function tick() {
    var inApp = !!document.querySelector(".km-tabbar");
    var fab = document.getElementById("km-check-fab");
    if (inApp && !fab) mountFab();
    else if (!inApp && fab) { fab.parentNode.removeChild(fab); closeSheet(); }
    if (inApp) syncProfileSection(); else removeProfileSection();
  }
  function start() {
    // Секция «Мои чеки» живёт вне дерева React (дописана прямо в .km-page).
    // При переключении вкладки React перерисовывает .km-page, и осиротевший узел
    // секции «всплывает» наверх чужой вкладки (например, «Мотика») и висит до
    // следующего tick(). Ловим клик в фазе перехвата — раньше, чем React успеет
    // перерисоваться, — и убираем секцию СИНХРОННО, ещё до отрисовки кадра.
    // tick() вернёт её обратно, если мы действительно на «Профиле».
    document.addEventListener("click", function (ev) {
      var node = ev.target, tab = node && node.closest ? node.closest(".km-tab") : null;
      if (tab) {                       // клик по нижней вкладке
        if (!/Профиль/i.test(tab.textContent || "")) removeProfileSection();
        return;
      }
      // Навигация кнопкой из самой страницы (вызов setTab) — подчищаем в след. кадре.
      var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 0); };
      raf(function () { if (!isProfileActive()) removeProfileSection(); });
    }, true);
    setInterval(tick, 600); tick();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();

  window.KmCheck = { open: showChooser, apply: applyExpense, edit: editExpense, remove: deleteExpense, list: getExpenses, parseAmount: parseAmount };
})();
</script>

@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap');
:root{
  --bg:#EAF5EC; --bg2:#D6EEDC; --surface:#FFFFFF; --ink:#143025; --muted:#6E8A78;
  --line:#DCEDE0; --brand:#16A06A; --brand-d:#0C7C50; --brand-bg:#E3F5EB;
  --calm:#1FB573; --calm-bg:#E1F6EB; --tense:#EFA838; --tense-bg:#FBF0DA;
  --danger:#E5594E; --danger-bg:#FBE5E3; --critical:#143025; --critical-bg:#DDE7DF;
  --shadow:0 12px 32px -14px rgba(20,60,40,.32); --shadow-sm:0 5px 16px -10px rgba(20,60,40,.4);
}
*{box-sizing:border-box}
.km-root{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(130% 80% at 50% -8%, var(--bg2) 0%, var(--bg) 52%);min-height:100vh}
.km-shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.km-page{flex:1;padding:18px 16px 110px;display:flex;flex-direction:column;gap:14px}
.km-display{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:-.01em;line-height:1.06}
h1.km-display{font-size:30px;margin:0} h2.km-display{font-size:22px;margin:0}
.km-muted{color:var(--muted)}
.km-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow-sm)}
.km-rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.km-d1{animation-delay:.05s}.km-d2{animation-delay:.12s}.km-d3{animation-delay:.2s}.km-d4{animation-delay:.28s}.km-d5{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.km-btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;border:none;border-radius:18px;
  padding:15px 18px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease, box-shadow .2s ease;background:var(--bg2);color:var(--ink)}
.km-btn:active{transform:scale(.97)}
.km-btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;box-shadow:0 10px 22px -8px rgba(12,124,80,.7)}
.km-btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
.km-btn:disabled{opacity:.45;cursor:not-allowed}

.km-input{font-family:'Fredoka';font-weight:600;font-size:26px;color:var(--ink);width:100%;border:2px solid var(--line);
  background:var(--bg);border-radius:18px;padding:16px 56px 16px 18px;outline:none;transition:border-color .15s}
.km-input:focus{border-color:var(--brand)}
.km-inwrap{position:relative}
.km-suffix{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-family:'Fredoka';font-weight:600;font-size:22px;color:var(--muted)}
.km-textin{font-family:'Nunito';font-weight:700;font-size:17px;width:100%;border:2px solid var(--line);background:var(--bg);
  border-radius:16px;padding:14px 16px;outline:none;color:var(--ink)}
.km-textin:focus{border-color:var(--brand)}
.km-textin::placeholder{color:var(--muted);font-weight:600}

.km-chip{font-family:'Nunito';font-weight:700;font-size:15px;text-align:left;border:2px solid var(--line);background:var(--surface);
  border-radius:18px;padding:16px 18px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:.15s}
.km-chip:active{transform:scale(.98)}
.km-chip.on{border-color:var(--brand);background:var(--brand-bg)}
.km-chip .em{font-size:22px}

.km-pill{display:inline-flex;align-items:center;gap:6px;font-family:'Fredoka';font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px}
.km-progress{height:9px;background:var(--line);border-radius:999px;overflow:hidden}
.km-progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--calm));border-radius:999px;transition:width .5s ease}

.km-metric{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:13px}
.km-metric .lab{font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:5px}
.km-metric .val{font-family:'Fredoka';font-weight:600;font-size:20px;margin-top:6px}

.km-tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:40}
.km-tabbar-inner{pointer-events:auto;width:100%;max-width:480px;margin:0 12px 12px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
  display:flex;justify-content:space-around;padding:8px 6px}
.km-tab{background:none;border:none;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;border-radius:16px;color:var(--muted);font-family:'Fredoka';font-weight:600;font-size:11px;transition:.18s}
.km-tab.on{color:var(--brand);background:var(--brand-bg)}

.km-mascot{will-change:transform}
.sway{animation:sway 3.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-5px)}}
.fidget{animation:fidget 2.6s ease-in-out infinite}
@keyframes fidget{0%,100%{transform:translateY(0)}25%{transform:translateY(-2px) rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
.tremble{animation:tremble .34s linear infinite}
@keyframes tremble{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.4px,1px) rotate(-1deg)}50%{transform:translate(1.4px,-1px)}75%{transform:translate(-1px,-1px) rotate(1deg)}}
.drip{animation:drip 1.7s ease-in infinite}
@keyframes drip{0%{opacity:0;transform:translateY(-2px)}30%{opacity:1}100%{opacity:0;transform:translateY(11px)}}
.blink{animation:blink 4.6s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

.km-skel{background:linear-gradient(90deg,var(--line) 25%,#eef7f0 37%,var(--line) 63%);background-size:400% 100%;
  animation:sh 1.3s infinite;border-radius:10px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

.km-light{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka';font-weight:700;font-size:13px;color:#fff;transition:.3s}

.km-toast{position:fixed;top:14px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.km-toast .t{pointer-events:auto;background:var(--ink);color:#fff;font-family:'Fredoka';font-weight:600;font-size:14px;
  padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;animation:pop .35s both}

.km-badge{min-height:76px;border-radius:20px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;padding:9px 5px;text-align:center;min-width:0}
.km-badge.lk{opacity:.5}
.km-badge .ic{height:26px;display:flex;align-items:center;justify-content:center;line-height:1;flex:0 0 auto}
.km-badge .nm{width:100%;font-size:10.5px;font-weight:800;line-height:1.1;overflow-wrap:anywhere;word-break:break-word;hyphens:auto}
input[type=range]{accent-color:var(--brand)}

/* ---- \u043A\u0430\u0441\u0442\u043E\u043C\u0438\u0437\u0430\u0446\u0438\u044F / \u0433\u0430\u0440\u0434\u0435\u0440\u043E\u0431 ---- */
.km-hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--brand-bg),var(--calm-bg));border-color:transparent}
.km-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 80% 0%,rgba(255,255,255,.5),transparent 60%);pointer-events:none}
.km-eqrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.km-eq{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-family:'Fredoka';font-weight:600;font-size:12px}
.km-wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.km-item{position:relative;aspect-ratio:1;border-radius:18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;transition:.15s;text-align:center}
.km-item:active{transform:scale(.95)}
.km-item.on{border-color:var(--brand);background:var(--brand-bg);box-shadow:0 6px 16px -10px var(--brand)}
.km-item.lk{cursor:not-allowed;opacity:.6}
.km-item .em{font-size:26px;line-height:1}
.km-item .nm{font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.05}
.km-item .sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:inset 0 -3px 6px rgba(0,0,0,.12)}
.km-item .lkbadge{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center}
.km-secttl{display:flex;align-items:center;gap:7px;font-family:'Fredoka';font-weight:600;font-size:15px;margin:2px 0 2px}
.km-reqhint{font-size:11.5px;font-weight:700;color:var(--tense);min-height:15px;margin-top:2px}

/* ---- \u0447\u0435\u043B\u043B\u0435\u043D\u0434\u0436\u0438 ---- */
.km-chal{border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.km-chal.done{background:var(--calm-bg);border-color:transparent}
.km-chal-top{display:flex;align-items:center;gap:11px}
.km-chal-ic{width:42px;height:42px;flex-shrink:0;border-radius:13px;background:var(--brand-bg);display:flex;align-items:center;justify-content:center;font-size:22px}
.km-chal-meta{flex:1;min-width:0}
.km-chal-nm{font-family:'Fredoka';font-weight:600;font-size:15.5px;line-height:1.1}
.km-chal-ds{font-weight:600;font-size:12.5px;color:var(--muted);line-height:1.25}
.km-reward{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12px;color:var(--brand-d);background:var(--brand-bg);padding:4px 9px;border-radius:999px}

/* ---- \u0441\u043F\u0430\u0440\u043A\u043B\u0430\u0439\u043D ---- */
.km-spark line, .km-spark polyline{vector-effect:non-scaling-stroke}

/* ---- \u0448\u0435\u0440\u0438\u043D\u0433 (\u043C\u043E\u0434\u0430\u043B\u043A\u0430) ---- */
.km-modal{position:fixed;inset:0;z-index:80;background:rgba(20,48,37,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.km-sheet{width:100%;max-width:480px;background:var(--surface);border-radius:28px 28px 0 0;padding:20px 18px 26px;box-shadow:0 -20px 50px -20px rgba(20,60,40,.5);animation:up .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.km-sharecard{border-radius:22px;padding:20px;background:linear-gradient(160deg,var(--brand-bg),var(--calm-bg));text-align:center;position:relative;overflow:hidden}
