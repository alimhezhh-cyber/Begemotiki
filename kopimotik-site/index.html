<script>/* DEMO SHIM — автономный демо-режим без сервера (in-memory + localStorage) */
(function(){
  var DEMO={"profile": {"income": 180000, "mandatoryExpenses": 70000, "creditPayments": 0, "savings": 600000, "incomeStability": "stable", "impulseLevel": 0, "debts": [], "living": {"rent": 35000, "food": 22000, "other": 13000}}, "plan": {"price": 0, "payment": "credit", "monthlyPayment": 0, "rate": 0, "term": 0, "title": "", "on": false}, "goals": [{"id": "g_gifts", "title": "Подарки и мелочи", "amount": 60000, "months": 6, "saved": 10000}, {"id": "g_japan", "title": "Отпуск в Японии", "amount": 400000, "months": 8, "saved": 120000}, {"id": "g_reno", "title": "Ремонт на кухне", "amount": 300000, "months": 4, "saved": 60000}, {"id": "g_car", "title": "Машина", "amount": 1500000, "months": 10, "saved": 200000}], "xp": 320, "streak": 12, "cleanStreak": 9, "bestCleanStreak": 21, "lastCheckIn": "", "checkins": {}, "scores": {}, "cosmetics": {"palette": "mood", "hat": "none", "accessory": "none"}, "challenges": {}, "learn": {"tips": [], "acked": false, "tipDay": "", "remindAt": ""}, "flags": {"onboard": true, "checkin": false, "purchase": false}, "onboarded": true};
  var MEM={ "km:user:demo": JSON.stringify(DEMO), "km:users": JSON.stringify({demo:{pw:"demo",createdAt:Date.now()}}) };
  var LS=null; try{ LS=window.localStorage; }catch(e){}
  // восстановить прежние правки из localStorage, если были; иначе засеять
  try{ if(LS){ if(LS.getItem("kmdemo:seeded")==="4"){ var a=LS.getItem("kmdemo:km:user:demo"); if(a)MEM["km:user:demo"]=a; var b=LS.getItem("kmdemo:km:users"); if(b)MEM["km:users"]=b; }
    else { LS.setItem("kmdemo:km:user:demo",MEM["km:user:demo"]); LS.setItem("kmdemo:km:users",MEM["km:users"]); LS.setItem("km:session","demo"); LS.setItem("kmdemo:seeded","4"); } } }catch(e){}
  // сессия читается шимом напрямую из localStorage — подстрахуемся на случай блокировки
  try{ if(LS && LS.getItem("km:session")==null) LS.setItem("km:session","demo"); }catch(e){}
  function rd(k){ if(LS){ try{ var v=LS.getItem("kmdemo:"+k); if(v!=null) return v; }catch(e){} } return (k in MEM)?MEM[k]:null; }
  function wr(k,v){ MEM[k]=v; if(LS){ try{ LS.setItem("kmdemo:"+k,v); }catch(e){} } }
  function del(k){ delete MEM[k]; if(LS){ try{ LS.removeItem("kmdemo:"+k); }catch(e){} } }
  var realFetch=window.fetch?window.fetch.bind(window):null;
  function J(o,st){ return new Response(JSON.stringify(o),{status:st||200,headers:{"Content-Type":"application/json"}}); }
  function qget(q,n){ var m=q.match(new RegExp("(?:^|&)"+n+"=([^&]*)")); return m?decodeURIComponent(m[1]):null; }
  window.fetch=function(input,init){
    try{
      var url=typeof input==="string"?input:(input&&input.url)||"";
      var method=((init&&init.method)||(input&&input.method)||"GET").toUpperCase();
      var qi=url.indexOf("?"),path=qi>=0?url.slice(0,qi):url,q=qi>=0?url.slice(qi+1):"";
      if(/\/api\/kv$/.test(path)){
        if(method==="GET"){ var v=rd(qget(q,"key")); return Promise.resolve(J(v!=null?{value:v}:{value:null})); }
        if(method==="POST"){ var bd=JSON.parse((init&&init.body)||"{}");
          if(bd.key==="km:users"){ var cur={};try{cur=JSON.parse(rd("km:users")||"{}");}catch(e){} var inc={};try{inc=JSON.parse(bd.value||"{}");}catch(e){} for(var kk in inc)cur[kk]=inc[kk]; wr("km:users",JSON.stringify(cur)); }
          else wr(bd.key,bd.value);
          return Promise.resolve(J({ok:true})); }
        if(method==="DELETE"){ del(qget(q,"key")); return Promise.resolve(J({ok:true})); }
      }
      if(/\/api\/kv-list$/.test(path)){ var prefix=qget(q,"prefix")||"",keys=[]; for(var key in MEM){ if(key.indexOf("km:user:")===0 && key.indexOf(prefix)===0) keys.push(key);} return Promise.resolve(J({keys:keys})); }
    }catch(e){}
    return realFetch?realFetch(input,init):Promise.reject(new Error("offline demo"));
  };
})();
</script>
<script>/* km_goals.js: важность/сортировка целей */
/* km_goals.js — слой «важности» для целей КопиМотик.
 * Чистая надстройка: НИЧЕГО не пишет в данные, не меняет адаптер/схему.
 * Считает приоритет цели из уже существующих полей (amount, saved, months)
 * и свободного бюджета free. Используется бандлом для сортировки списка
 * целей и для бейджа приоритета на карточке.
 */
(function () {
  // та же логика, что у внутренней vc(): сколько осталось, нужно/мес, реально ли
  function calc(g, free) {
    var amount = +(g && g.amount) || 0;
    var saved = +(g && g.saved) || 0;
    var remaining = Math.max(amount - saved, 0);
    var months = (+(g && g.months) > 0) ? +g.months : 0;
    var needPerMonth = months > 0 ? remaining / months : Infinity;
    var hasBudget = (+free || 0) > 0;
    var realistic = hasBudget ? needPerMonth <= free : null; // null => бюджет неизвестен
    var minMonths = hasBudget && free > 0 ? Math.ceil(remaining / free) : null;
    return { amount: amount, saved: saved, remaining: remaining, months: months,
             needPerMonth: needPerMonth, realistic: realistic, minMonths: minMonths,
             hasBudget: hasBudget };
  }

  // категория важности
  function tier(g, free) {
    var v = calc(g, free);
    if (v.remaining <= 0) return "done";                 // цель достигнута
    if (v.hasBudget && v.realistic === false) return "risk"; // не вписывается в бюджет
    var m = v.months || 999;
    if (m <= 3) return "soon";                           // скоро срок
    if (m <= 12) return "track";                         // идём в графике
    return "later";                                      // долгий горизонт
  }

  // чем выше rank-важность, тем выше в списке (done — в самый низ)
  var RANK = { risk: 4, soon: 3, track: 2, later: 1, done: 0 };
  var META = {
    risk:  { emoji: "🔥", label: "Под угрозой", color: "var(--danger, #e5484d)", bg: "var(--danger-bg, #fdecec)" },
    soon:  { emoji: "⏳", label: "Скоро срок",  color: "var(--tense, #b46a00)",  bg: "var(--tense-bg, #fff3e0)" },
    track: { emoji: "🎯", label: "В графике",   color: "var(--calm, #2e9e6b)",   bg: "var(--calm-bg, #e8f7ef)" },
    later: { emoji: "🌱", label: "В планах",    color: "var(--muted, #8a8f98)",  bg: "var(--card-2, rgba(0,0,0,.05))" },
    done:  { emoji: "✅", label: "Готово",      color: "var(--calm, #2e9e6b)",   bg: "var(--calm-bg, #e8f7ef)" }
  };

  // числовой приоритет: категория (грубо) + дедлайн + недобор прогресса + размер
  function score(g, free) {
    var v = calc(g, free);
    var t = tier(g, free);
    if (t === "done") return -1;
    var base = RANK[t] * 1000;
    var progress = v.amount > 0 ? v.saved / v.amount : 0;
    var deadline = v.months > 0 ? 100 / v.months : 0;        // ближе срок — выше
    var size = Math.min(v.remaining / 1000, 100);            // больше осталось — чуть выше
    return base + deadline * 5 + (1 - progress) * 20 + size * 0.1;
  }

  // НЕ мутирует исходный массив
  function sort(arr, free) {
    var a = (arr || []).slice();
    a.sort(function (x, y) {
      var d = score(y, free) - score(x, free);
      if (d) return d;
      return (+(y && y.amount) || 0) - (+(x && x.amount) || 0);
    });
    return a;
  }

  // React-элемент бейджа (React передаётся аргументом, чтобы не зависеть от глобали)
  function badgeEl(React, g, free) {
    var me = META[tier(g, free)] || META.later;
    return React.createElement("span", {
      title: "Приоритет: " + me.label,
      style: {
        display: "inline-flex", alignItems: "center", gap: 4,
        fontFamily: "inherit", fontWeight: 800, fontSize: 11, lineHeight: 1,
        padding: "4px 8px", borderRadius: 999,
        color: me.color, background: me.bg, whiteSpace: "nowrap"
      }
    }, me.emoji + " " + me.label);
  }

  window.KmGoals = { calc: calc, tier: tier, score: score, sort: sort, badgeEl: badgeEl, _meta: META };
})();

</script>
<script>/* km_moto.js: косметика «Мотоцикл» */
/* km_moto.js — косметика «Мотоцикл» для Мотика.
 * Чистая отрисовка: возвращает SVG-группы (React-элементы) в системе
 * координат маскота viewBox="0 0 200 200". Рисуется в два слоя:
 *   back()  — рама, колёса, бак, выхлоп с дымком  (ЗА бегемотиком)
 *   front() — руль, фара, зеркальце, лайны скорости (ПЕРЕД бегемотиком)
 * Никаких данных/схемы не трогает — это просто значение accessory:"moto".
 */
(function () {
  // палитра мотоцикла (не зависит от палитры Мотика)
  var TIRE = "#23262B", RIM = "#C7CDD6", HUB = "#6B7280";
  var RED = "#E5463C", RED_HI = "#FF6B5E", RED_DK = "#B5352D";
  var METAL = "#3A4049", CHROME = "#AEB6C2";
  var LAMP = "#FFD45E", LAMP_HI = "#FFF1B8";
  var SMOKE = "#C9CDD3";

  function wheel(e, cx) {
    return e("g", null,
      e("circle", { cx: cx, cy: 178, r: 17, fill: TIRE }),
      e("circle", { cx: cx, cy: 178, r: 10, fill: "none", stroke: RIM, strokeWidth: 3 }),
      e("circle", { cx: cx, cy: 178, r: 3.4, fill: HUB }),
      // несколько спиц
      e("line", { x1: cx, y1: 171, x2: cx, y2: 185, stroke: RIM, strokeWidth: 1.6 }),
      e("line", { x1: cx - 6, y1: 178, x2: cx + 6, y2: 178, stroke: RIM, strokeWidth: 1.6 }),
      e("line", { x1: cx - 4.5, y1: 173.5, x2: cx + 4.5, y2: 182.5, stroke: RIM, strokeWidth: 1.3 }),
      e("line", { x1: cx - 4.5, y1: 182.5, x2: cx + 4.5, y2: 173.5, stroke: RIM, strokeWidth: 1.3 })
    );
  }

  function back(React) {
    var e = function () { return React.createElement.apply(React, arguments); };
    return e("g", { className: "km-moto-back" },
      // выхлоп + дымок (слева-сзади), для улыбки
      e("circle", { cx: 16, cy: 168, r: 6, fill: SMOKE, opacity: 0.28 }),
      e("circle", { cx: 27, cy: 173, r: 4.5, fill: SMOKE, opacity: 0.45 }),
      e("circle", { cx: 36, cy: 176, r: 3.2, fill: SMOKE, opacity: 0.6 }),
      e("path", { d: "M40 176 L62 170 q6 -1 6 5 l-22 6 q-7 1 -6 -5 Z", fill: METAL }),

      // колёса
      wheel(e, 46),
      wheel(e, 154),

      // нижняя рама от заднего к переднему колесу
      e("path", { d: "M46 178 L84 161 L120 161 L154 178", fill: "none", stroke: METAL, strokeWidth: 5, strokeLinecap: "round", strokeLinejoin: "round" }),
      // передняя вилка
      e("line", { x1: 154, y1: 178, x2: 146, y2: 150, stroke: METAL, strokeWidth: 5, strokeLinecap: "round" }),

      // бак/корпус (красный, частично выглядывает из-под Мотика)
      e("path", { d: "M74 160 Q100 150 130 156 Q140 158 138 165 L78 167 Q72 166 74 160 Z", fill: RED, stroke: RED_DK, strokeWidth: 1.5 }),
      e("path", { d: "M84 156 Q104 152 122 156", stroke: RED_HI, strokeWidth: 2.4, fill: "none", strokeLinecap: "round" }),

      // седло под Мотиком
      e("rect", { x: 80, y: 150, width: 40, height: 11, rx: 5, fill: "#2B2F36" }),

      // подножки под лапками
      e("rect", { x: 70, y: 168, width: 9, height: 4, rx: 2, fill: CHROME }),
      e("rect", { x: 121, y: 168, width: 9, height: 4, rx: 2, fill: CHROME })
    );
  }

  function front(React) {
    var e = function () { return React.createElement.apply(React, arguments); };
    return e("g", { className: "km-moto-front" },
      // лайны скорости слева — намёк на движение
      e("line", { x1: 6, y1: 120, x2: 26, y2: 120, stroke: SMOKE, strokeWidth: 3, strokeLinecap: "round", opacity: 0.7 }),
      e("line", { x1: 2, y1: 134, x2: 24, y2: 134, stroke: SMOKE, strokeWidth: 3, strokeLinecap: "round", opacity: 0.85 }),
      e("line", { x1: 8, y1: 148, x2: 28, y2: 148, stroke: SMOKE, strokeWidth: 3, strokeLinecap: "round", opacity: 0.55 }),

      // стойка руля
      e("line", { x1: 146, y1: 150, x2: 150, y2: 126, stroke: METAL, strokeWidth: 5, strokeLinecap: "round" }),
      // перекладина руля
      e("line", { x1: 138, y1: 126, x2: 170, y2: 122, stroke: METAL, strokeWidth: 5, strokeLinecap: "round" }),
      // грипсы
      e("circle", { cx: 138, cy: 126, r: 3.6, fill: RED }),
      e("circle", { cx: 170, cy: 122, r: 3.6, fill: RED }),
      // зеркальце
      e("line", { x1: 167, y1: 122, x2: 173, y2: 113, stroke: METAL, strokeWidth: 2.4, strokeLinecap: "round" }),
      e("circle", { cx: 174, cy: 112, r: 3, fill: CHROME }),

      // фара спереди со свечением
      e("circle", { cx: 165, cy: 158, r: 9, fill: LAMP_HI, opacity: 0.5 }),
      e("circle", { cx: 165, cy: 158, r: 5.5, fill: LAMP, stroke: CHROME, strokeWidth: 1.5 }),
      e("circle", { cx: 163.5, cy: 156.5, r: 1.6, fill: "#fff", opacity: 0.9 })
    );
  }

  window.KmMoto = { back: back, front: front };
})();

</script>
<script>/* storage поверх сервера (сессия — локально в браузере) */
/* km_server_shim.js — window.storage поверх REST API сервера.
 *
 * Роутинг ключей (важно для мультиюзера):
 *   km:session   — локально в браузере (у каждого свой вход, иначе один вход
 *                  перелогинивал бы всех);
 *   km:users     — на сервере (общий список аккаунтов, мерж при записи);
 *   km:user:<id> — на сервере, через db_adapter (таблицы SQLite).
 *
 * Методы async, возвращают { key, value } | null; value — строка.
 */
(function () {
  var SESSION_KEY = "km:session";
  var API = "/api/kv";

  function localGet(k) {
    try { var v = window.localStorage.getItem(k); return v != null ? { key: k, value: v } : null; }
    catch (e) { return null; }
  }
  function localSet(k, val) { try { window.localStorage.setItem(k, val); } catch (e) {} return { key: k, value: val }; }
  function localDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} return { key: k, deleted: true }; }

  window.storage = {
    get: async function (key /*, shared */) {
      if (key === SESSION_KEY) return localGet(key);
      try {
        var r = await fetch(API + "?key=" + encodeURIComponent(key), { headers: { Accept: "application/json" } });
        if (!r.ok) return null;
        var j = await r.json();
        return (j && j.value != null) ? { key: key, value: j.value } : null;
      } catch (e) { console.error("storage.get", key, e); return null; }
    },

    set: async function (key, value /*, shared */) {
      if (key === SESSION_KEY) return localSet(key, value);
      try {
        await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: key, value: value })
        });
      } catch (e) { console.error("storage.set", key, e); }
      return { key: key, value: value };
    },

    delete: async function (key /*, shared */) {
      if (key === SESSION_KEY) return localDel(key);
      try { await fetch(API + "?key=" + encodeURIComponent(key), { method: "DELETE" }); }
      catch (e) { console.error("storage.delete", key, e); }
      return { key: key, deleted: true };
    },

    list: async function (prefix /*, shared */) {
      var keys = [];
      try {
        var url = "/api/kv-list" + (prefix ? "?prefix=" + encodeURIComponent(prefix) : "");
        var r = await fetch(url, { headers: { Accept: "application/json" } });
        if (r.ok) { var j = await r.json(); keys = (j && j.keys) || []; }
      } catch (e) { console.error("storage.list", e); }
      // сессия живёт локально — добавим её, если подходит под префикс
      if ((!prefix || SESSION_KEY.indexOf(prefix) === 0) &&
          localGet(SESSION_KEY) && keys.indexOf(SESSION_KEY) < 0) {
        keys.push(SESSION_KEY);
      }
      return { keys: keys };
    }
  };
})();

</script>
<script>/* STANDALONE DEMO — без сервера: localStorage + демо-профиль (высокий индекс) */
(function () {
  "use strict";
  // диагноз через Anthropic в офлайне недоступен — гасим запрос, приложение показывает встроенный запасной диагноз
  try {
    var _f = window.fetch ? window.fetch.bind(window) : null;
    window.fetch = function (u) {
      var s = typeof u === "string" ? u : (u && u.url) || "";
      if (/api\.anthropic\.com/i.test(s)) return Promise.reject(new Error("offline demo"));
      return _f ? _f.apply(window, arguments) : Promise.reject(new Error("offline demo"));
    };
  } catch (e) {}

  // всё хранилище — локально, без /api/kv
  function g(k){try{var v=localStorage.getItem(k);return v!=null?{key:k,value:v}:null;}catch(e){return null;}}
  function st(k,v){try{localStorage.setItem(k,String(v));}catch(e){}return{key:k,value:v};}
  function dl(k){try{localStorage.removeItem(k);}catch(e){}return{key:k,deleted:true};}
  function ls(p){var ks=[];try{for(var i=0;i<localStorage.length;i++){var kk=localStorage.key(i);if(!p||(kk&&kk.indexOf(p)===0))ks.push(kk);}}catch(e){}return{keys:ks,prefix:p||""};}
  window.storage={get:function(k){return Promise.resolve(g(k));},set:function(k,v){return Promise.resolve(st(k,v));},delete:function(k){return Promise.resolve(dl(k));},list:function(p){return Promise.resolve(ls(p));}};

  // демо-аккаунт с высоким индексом (значения JSON-кодируются — как пишет само приложение через fe)
  try {
    if (!localStorage.getItem("km:session")) localStorage.setItem("km:session", JSON.stringify("demo"));
    if (!localStorage.getItem("km:users")) localStorage.setItem("km:users", JSON.stringify({ demo: { pw: "x", createdAt: Date.now() } }));
    if (!localStorage.getItem("km:user:demo")) {
      var rec = {
        profile: { income: 200000, mandatoryExpenses: 60000, creditPayments: 0, savings: 800000, incomeStability: "stable", impulseLevel: 0, debts: [], living: { rent: 40000, food: 15000, other: 5000 } },
        plan: { price: 0, payment: "credit", monthlyPayment: 0, rate: 0, term: 0, title: "", on: false },
        goals: [], xp: 240, streak: 4, cleanStreak: 4, bestCleanStreak: 7, lastCheckIn: "",
        checkins: {}, scores: {}, cosmetics: { palette: "mood", hat: "none", accessory: "none" },
        challenges: {}, learn: { tips: [], remindAt: "", acked: true, tipDay: "" },
        flags: { onboard: true, checkin: false, purchase: false }, onboarded: true
      };
      localStorage.setItem("km:user:demo", JSON.stringify(rec));
    }
  } catch (e) {}

  window.__KM_STANDALONE__ = "v2";
})();
</script>
<script>/* km_debt.js: разбор долгов + калькулятор досрочки */
/* km_debt.js — «Разбор долгов»: советник + калькулятор досрочного погашения.
 *
 * Надстройка в духе km_goals.js / km_moto.js: не трогает бандл, схему и адаптер,
 * читает данные пользователя через window.storage (km:session -> km:user:<логин>).
 * Точка входа — карточка внутри вкладки «Светофор», вшивается в .km-page.
 *
 * Арифметика — в window.KmDebt, DOM-часть включается только в браузере. Долги
 * без остатка (поле необязательное) тоже учитываются: и в нагрузке, и в списке
 * приоритета, и в калькуляторе — остаток можно вписать прямо там.
 */
(function () {
  var root = (typeof window !== "undefined") ? window : (typeof globalThis !== "undefined" ? globalThis : this);

  // ---------------------------------------------------------------- helpers
  function num(v) { var n = +v; return isFinite(n) ? n : 0; }

  // настоящий долг — у которого есть платёж ИЛИ остаток
  function isRealDebt(d) { d = d || {}; return num(d.monthly) > 0 || num(d.balance) > 0; }

  // сумма ежемесячных платежей по долгам (а если их нет — общий creditPayments)
  function debtMonthly(p) {
    p = p || {};
    var list = p.debts || [];
    var s = 0;
    for (var i = 0; i < list.length; i++) s += num(list[i].monthly);
    if (s <= 0) s = num(p.creditPayments); // запасной путь: плоское поле из онбординга
    return s;
  }

  function simulate(balance, annualRatePct, payment, extra, lump) {

  /* Обратная задача: какую доплату/мес нужно делать, чтобы закрыть долг за

      if (!u || u.value == null) return null;
      var data = parseMaybe(u.value);
      return { name: name, profile: (data && data.profile) || {} };
    } catch (e) { return null; }
  }

  // ------- состояние модалки -------
  var state = { method: "avalanche", debtId: null, extra: 0, lump: 0, profile: null, balances: {} };

  function statCard(label, value) {
    return el("div", { class: "km-debt-stat" }, [
      el("div", { class: "l" }, label),
      el("div", { class: "v" }, value)
    ]);
  }

  function renderInto(sheet) {
    var p = state.profile || {};
    var debts = order(p.debts, state.method);
    sheet.innerHTML = "";

    // ручка-grip + шапка
    sheet.appendChild(el("div", { class: "km-debt-grip" }));
    sheet.appendChild(el("div", { class: "km-debt-head" }, [
      el("div", { class: "km-debt-badge" }, gaugeSvg(22, "#fff")),
      el("div", { class: "km-debt-title" }, "Разбор долгов"),
      el("button", { class: "km-debt-x", onclick: close }, "\u00D7")
    ]));

    if (!hasDebts(p)) {
      sheet.appendChild(el("div", { class: "km-debt-empty" }, [
        el("div", { class: "em" }, "\uD83C\uDFCD\uFE0F"),
        el("div", { class: "tt" }, "Долгов нет — красота"),
        el("div", { class: "ds" }, "Мотик газует налегке. Если появится кредит или рассрочка — добавь её в «Светофоре», и здесь будет план, как разгрузиться быстрее всего.")
      ]));
      return;
    }

    var pdn = debtBurden(p), cush = cushionMonths(p), surplus = surplusOverCushion(p), sit = situation(p);
    var missing = missingBalanceCount(p);
    sheet.appendChild(el("div", { class: "km-debt-sub" }, "Как быстрее выбраться: с чего гасить, что это даст и сколько вкладывать."));

    // снапшот
    sheet.appendChild(el("div", { class: "km-debt-snap" }, [
      statCard("Всего по долгам", totalBalance(p) > 0 ? fmtMoney(totalBalance(p)) : "не указан"),
      statCard("Платежей в месяц", fmtMoney(debtMonthly(p))),
      statCard("Долговая нагрузка", num(p.income) > 0 ? fmtPct(pdn) + " дохода" : "—"),
      statCard("Подушка", isFinite(cush) ? (Math.round(cush * 10) / 10).toString().replace(".", ",") + " мес" : "есть")
    ]));

    if (missing > 0) {
      sheet.appendChild(el("div", { class: "km-debt-hint" },
        "У " + missing + " " + plural(missing, "долга", "долгов", "долгов") + " не указан остаток — платежи учтены, но чтобы посчитать срок и переплату, впиши остаток в калькуляторе ниже."));
    }

    // баннер режима
    if (sit === "pit") {
      sheet.appendChild(el("div", { class: "km-debt-banner pit" }, [
        el("b", null, "Нагрузка высокая — сначала стабилизируемся."),
        el("ul", null, [
          el("li", null, "Стоп на новые кредиты и рассрочки."),
          el("li", null, "Собери мини-подушку хотя бы на 0,5–1 месяц — чтобы любой сюрприз не загонял в новый долг."),
          el("li", null, "Гаси по очереди самый дорогой долг (см. ниже), остальные — минимальным платежом."),
          el("li", null, "По грабительским ставкам стоит поговорить с банком про рефинанс/реструктуризацию."),
          el("li", null, "Параллельно — урезать расходы или поднять доход; одной досрочкой из глубокой ямы не выгрести.")
        ])
      ]));
    } else {
      var msg = surplus > 0
        ? ["Сверх подушки у тебя ", el("b", null, fmtMoney(surplus)), ". Это можно разово бросить в самый дорогой долг — подставил в калькулятор кнопкой ниже."]
        : ["Подушка прежде всего. Как доберёшь её до нормы — лишнее направляй в досрочку, начиная с самой дорогой ставки."];
      sheet.appendChild(el("div", { class: "km-debt-banner ok" }, msg));
    }

    // приоритет + переключатель метода
    sheet.appendChild(el("div", { class: "km-debt-sec" }, [
      el("span", null, "С чего гасить"),
      el("div", { class: "km-debt-toggle" }, [
        el("button", {
          class: state.method === "avalanche" ? "on" : "",
          onclick: function () { state.method = "avalanche"; renderInto(sheet); }
        }, "Лавина"),
        el("button", {
          class: state.method === "snowball" ? "on" : "",
          onclick: function () { state.method = "snowball"; renderInto(sheet); }
        }, "Снежный ком")
      ])
    ]));
    sheet.appendChild(el("div", { class: "km-debt-sub", style: "margin:-4px 0 8px" },
      state.method === "avalanche"
        ? "Лавина: сначала самая высокая ставка — так меньше всего переплата."
        : "Снежный ком: сначала самый маленький остаток — быстрее закрываешь первый долг и держишь мотивацию."));

    var list = el("div", { class: "km-debt-list" });
    debts.forEach(function (d, idx) {
      var hasBal = num(d.balance) > 0;
      list.appendChild(el("div", { class: "km-debt-item" + (idx === 0 ? " first" : "") }, [
        el("div", { class: "km-debt-rank" }, String(idx + 1)),
        el("div", { style: "min-width:0" }, [
          el("div", { class: "nm" }, d.title || "Кредит"),
          el("div", { class: "meta" }, (num(d.rate) > 0 ? fmtPct(num(d.rate) / 100) + " годовых \u00B7 " : "") + "платёж " + fmtMoney(d.monthly)),
          idx === 0 ? el("div", { class: "km-debt-tag" }, state.method === "avalanche" ? "гасить первым: дороже всего" : "гасить первым: ближе всего к нулю") : null
        ]),
        el("div", { class: "right" }, hasBal
          ? [el("div", { class: "b" }, fmtMoney(d.balance)), el("div", { class: "u" }, "остаток")]
          : [el("div", { class: "b" }, "—"), el("div", { class: "u miss" }, "нет остатка")])
      ]));
    });
    sheet.appendChild(list);

    // ---- калькулятор ----
    sheet.appendChild(el("div", { class: "km-debt-sec" }, "Калькулятор досрочки"));
    if (state.debtId == null || !debts.some(function (d) { return d.id === state.debtId; })) {
      state.debtId = debts[0].id;
    }
    var calc = el("div", { class: "km-debt-calc" });

    // выбор долга
    var sel = el("select", { class: "km-debt-select" });
    debts.forEach(function (d) {
      var label = (d.title || "Кредит") + (num(d.balance) > 0 ? " — " + fmtMoney(d.balance) : " — остаток не указан");
      var o = el("option", { value: d.id }, label);
      if (d.id === state.debtId) o.setAttribute("selected", "selected");
      sel.appendChild(o);
    });
    sel.addEventListener("change", function () { state.debtId = sel.value; renderInto(sheet); });
    calc.appendChild(el("div", { class: "km-debt-row" }, [el("label", null, "Какой долг гасим"), sel]));

    var cur = debts.filter(function (d) { return d.id === state.debtId; })[0] || debts[0];

    // фактический остаток (его можно вписать прямо тут, если в профиле он пустой)
    var balKnown = num(cur.balance) > 0;
    var balVal = (state.balances[cur.id] != null && state.balances[cur.id] !== "")
      ? state.balances[cur.id]
      : (balKnown ? String(num(cur.balance)) : "");
    var balIn = el("input", {
      class: "km-debt-input" + (!balVal ? " need" : ""), type: "number", inputmode: "numeric", min: "0",
      value: balVal, placeholder: balKnown ? "" : "впиши текущий остаток долга"
    });
    balIn.addEventListener("input", function () { state.balances[cur.id] = balIn.value; updateResult(); });
    var balRow = el("div", { class: "km-debt-row" }, [
      el("label", null, balKnown ? "Остаток долга, \u20BD" : "Остаток долга, \u20BD (в профиле не задан)"),
      balIn
    ]);
    calc.appendChild(balRow);

    // доплата в месяц
    var extraIn = el("input", { class: "km-debt-input", type: "number", inputmode: "numeric", min: "0", value: state.extra ? String(state.extra) : "", placeholder: "0" });
    extraIn.addEventListener("input", function () { state.extra = num(extraIn.value); updateResult(); });
    var extraChips = el("div", { class: "km-debt-chips" }, [1000, 3000, 5000, 10000].map(function (v) {
      return el("button", { class: "km-debt-chip", onclick: function () { state.extra = num(state.extra) + v; extraIn.value = state.extra; updateResult(); } }, "+" + fmtMoney(v));
    }).concat([
      el("button", { class: "km-debt-chip", onclick: function () { state.extra = 0; extraIn.value = ""; updateResult(); } }, "сброс")
    ]));
    calc.appendChild(el("div", { class: "km-debt-row" }, [el("label", null, "Доплачиваю сверх платежа, \u20BD/мес"), extraIn, extraChips]));

    // разовый платёж
    var lumpIn = el("input", { class: "km-debt-input", type: "number", inputmode: "numeric", min: "0", value: state.lump ? String(state.lump) : "", placeholder: "0" });
    lumpIn.addEventListener("input", function () { state.lump = num(lumpIn.value); updateResult(); });
    var lumpChipsKids = [];
    if (surplus > 0) lumpChipsKids.push(el("button", { class: "km-debt-chip", onclick: function () { state.lump = Math.round(surplus); lumpIn.value = state.lump; updateResult(); } }, "из профицита " + fmtMoney(surplus)));
    lumpChipsKids.push(el("button", { class: "km-debt-chip", onclick: function () { state.lump = 0; lumpIn.value = ""; updateResult(); } }, "сброс"));
    calc.appendChild(el("div", { class: "km-debt-row" }, [el("label", null, "Разовый платёж сейчас, \u20BD"), lumpIn, el("div", { class: "km-debt-chips" }, lumpChipsKids)]));

    var resultBox = el("div", null);
    calc.appendChild(resultBox);
    sheet.appendChild(calc);

    function effectiveBalance() {
      var ov = state.balances[cur.id];
      return (ov != null && ov !== "") ? num(ov) : num(cur.balance);
    }

    function updateResult() {
      resultBox.innerHTML = "";
      var bal = effectiveBalance();
      balIn.classList.toggle("need", !(bal > 0));

      // остаток не задан — просим вписать, без него срок/переплату не посчитать
      if (!(bal > 0)) {
        resultBox.appendChild(el("div", { class: "km-debt-ask" },
          "Чтобы посчитать срок и переплату по этому долгу, впиши его текущий остаток выше. Платёж в нагрузке уже учтён."));
        return;
      }
      if (!(num(cur.monthly) > 0) && !(num(state.extra) > 0)) {
        resultBox.appendChild(el("div", { class: "km-debt-ask" },
          "У этого долга не задан ежемесячный платёж. Добавь платёж в «Светофоре» или укажи доплату ниже, чтобы посчитать срок."));
        return;
      }

      var c = compare(cur, state.extra, state.lump, bal);
      var box = el("div", { class: "km-debt-result" });
      box.appendChild(el("div", { class: "big" }, [document.createTextNode("Закроешь за"), el("b", null, humanMonths(c.scenario.months))]));

      var grid = el("div", { class: "grid" }, [
        el("div", { class: "cell" }, [el("div", { class: "l" }, "Сейчас закрылся бы за"), el("div", { class: "v" }, humanMonths(c.base.months))]),
        el("div", { class: "cell" }, [el("div", { class: "l" }, "Быстрее на"), el("div", { class: "v save" }, isFinite(c.savedMonths) && c.savedMonths > 0 ? humanMonths(c.savedMonths) : "—")]),
        el("div", { class: "cell" }, [el("div", { class: "l" }, "Переплата сейчас"), el("div", { class: "v" }, fmtMoney(c.base.interest))]),
        el("div", { class: "cell" }, [el("div", { class: "l" }, "Сэкономишь на %"), el("div", { class: "v save" }, isFinite(c.savedInterest) && c.savedInterest > 0 ? fmtMoney(c.savedInterest) : "—")])
      ]);
      box.appendChild(grid);
      if (c.base.neverPays) box.appendChild(el("div", { class: "km-debt-warn" }, "Текущий платёж не покрывает даже проценты — без доплаты долг растёт. Подними платёж или доплачивай."));
      resultBox.appendChild(box);

      // обратная прикидка: доплата под целевой срок
      var tgt = el("div", { class: "km-debt-target" }, [el("div", { class: "ttl" }, "Хочу закрыть быстрее — сколько доплачивать:")]);
      var chips = el("div", { class: "km-debt-chips" }, [12, 24, 36].map(function (mo) {
        var need = extraForTarget(cur, mo, state.lump, bal);
        return el("button", {
          class: "km-debt-chip",
          onclick: function () { state.extra = need; extraIn.value = need || ""; updateResult(); }
        }, "за " + (mo / 12) + " " + plural(mo / 12, "год", "года", "лет") + " \u2192 +" + fmtMoney(need) + "/мес");
      }));
      tgt.appendChild(chips);
      resultBox.appendChild(tgt);
    }
    updateResult();

    sheet.appendChild(el("div", { class: "km-debt-foot" },
      "Учебная прикидка по аннуитету: без комиссий, страховок и плавающих ставок. Это не индивидуальная финансовая рекомендация — по конкретным условиям досрочного погашения уточняй в своём банке."));
  }

  // ------- открыть/закрыть -------
  var overlay, sheet;
  function ensureModal() {
    if (overlay) return;
    overlay = el("div", { class: "km-debt-overlay", onclick: function (e) { if (e.target === overlay) close(); } });
    sheet = el("div", { class: "km-debt-sheet" });
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
  }
  function onKey(e) { if (e.key === "Escape") close(); }
  async function open() {
    injectStyles(); ensureModal();
    sheet.innerHTML = "";
    sheet.appendChild(el("div", { class: "km-debt-grip" }));
    sheet.appendChild(el("div", { class: "km-debt-head" }, [
      el("div", { class: "km-debt-badge" }, gaugeSvg(22, "#fff")),
      el("div", { class: "km-debt-title" }, "Разбор долгов"),
      el("button", { class: "km-debt-x", onclick: close }, "\u00D7")
    ]));
    sheet.appendChild(el("div", { class: "km-debt-sub" }, "Считаю…"));
    overlay.classList.add("open");
    document.addEventListener("keydown", onKey);
    var d = await readData();
    state.profile = d ? d.profile : {};
    state.debtId = null; state.balances = {}; state.extra = 0; state.lump = 0;
    renderInto(sheet);
  }
  function close() { if (overlay) overlay.classList.remove("open"); document.removeEventListener("keydown", onKey); }

  // ====== точка входа во вкладке «Светофор» (а не плавающая кнопка) ======
  var ENTRY_ID = "km-debt-entry";
  var lastEntryRead = 0, cachedProfile = null;

  // мы на вкладке «Светофор», если активная кнопка таб-бара подписана «Светофор»
  function isCreditTab() {
    var on = document.querySelector(".km-tabbar .km-tab.on");
    if (on && /Светофор/.test(on.textContent || "")) return true;
    // запасной путь — по заголовку экрана
    var hs = document.querySelectorAll("h2.km-display");
    for (var i = 0; i < hs.length; i++) if (/Кредитный светофор/.test(hs[i].textContent || "")) return true;
    return false;
  }

  // карточка «Твои текущие кредиты» — вставляем точку входа сразу после неё
  function creditAnchor() {
    var cards = document.querySelectorAll(".km-page .km-card");
    for (var i = 0; i < cards.length; i++) if (/Твои текущие кредиты/.test(cards[i].textContent || "")) return cards[i];
    return null;
  }

  function entrySubtitle(p) {
    if (!p || !hasDebts(p)) return { text: "Долгов нет — но если появится кредит, тут будет план", chips: [] };
    var n = debtCount(p), pdn = debtBurden(p), sit = situation(p), miss = missingBalanceCount(p);
    var text = "План, как закрыть быстрее и меньше переплатить";
    var chips = [];
    chips.push({ t: n + " " + plural(n, "долг", "долга", "долгов"), cls: "" });
    if (num(p.income) > 0) chips.push({ t: "ПДН " + fmtPct(pdn), cls: sit === "pit" ? "pit" : "" });
    if (miss > 0) chips.push({ t: "уточни остаток", cls: "warn" });
    return { text: text, chips: chips };
  }

  function buildEntryNode() {
    var node = el("div", { id: ENTRY_ID, class: "km-debt-entry km-rise" });
    var ic = el("div", { class: "ic" }, gaugeSvg(22, "#fff"));
    var tx = el("div", { class: "tx" }, [
      el("b", null, "Разбор долгов"),
      el("small", { class: "km-debt-entry-sub" }, "Считаю…"),
      el("div", { class: "chips km-debt-entry-chips" })
    ]);
    var btn = el("button", { class: "km-debt-entry-btn", onclick: open }, [ic, tx, el("span", { class: "arr" }, "\u203A")]);
    node.appendChild(btn);
    return node;
  }

  function paintEntry(node, p) {
    var sub = node.querySelector(".km-debt-entry-sub");
    var chipsWrap = node.querySelector(".km-debt-entry-chips");
    if (!sub || !chipsWrap) return;
    var info = entrySubtitle(p);
    sub.textContent = info.text;
    chipsWrap.innerHTML = "";
    info.chips.forEach(function (c) {
      chipsWrap.appendChild(el("span", { class: "mini" + (c.cls ? " " + c.cls : "") }, c.t));
    });
  }

  function placeEntry(node) {
    var anchor = creditAnchor();
    if (anchor && anchor.parentNode) {
      if (anchor.nextSibling !== node) anchor.parentNode.insertBefore(node, anchor.nextSibling);
    } else {
      var page = document.querySelector(".km-page");
      if (page && node.parentNode !== page) page.appendChild(node);
    }
  }

  function refreshEntryData(node) {
    var now = Date.now();
    if (now - lastEntryRead < 2500 && cachedProfile) { paintEntry(node, cachedProfile); return; }
    lastEntryRead = now;
    readData().then(function (d) {
      cachedProfile = d ? d.profile : {};
      var n = document.getElementById(ENTRY_ID);
      if (n) paintEntry(n, cachedProfile);
    });
  }

  function syncEntry() {
    injectStyles();
    var node = document.getElementById(ENTRY_ID);
    if (isCreditTab()) {
      if (!node) { node = buildEntryNode(); paintEntry(node, cachedProfile || {}); }
      placeEntry(node);
      refreshEntryData(node);
    } else if (node && node.parentNode) {
      node.parentNode.removeChild(node);
    }
  }

  // следим за DOM (React перерисовывает .km-page) + лёгкий интервал
  var rafPending = false;
  function scheduleSync() {
    if (rafPending) return;
    rafPending = true;
    (root.requestAnimationFrame || function (f) { setTimeout(f, 16); })(function () { rafPending = false; syncEntry(); });
  }
  function start() {
    syncEntry();
    try {
      var mo = new MutationObserver(scheduleSync);
      mo.observe(document.body, { childList: true, subtree: true });
    } catch (e) {}
    setInterval(syncEntry, 1000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
<script>/* km_invest.js: изобилие — бегемотик будит спящие накопления */
/* km_invest.js — «Изобилие»: бегемотик будит спящие накопления.
 *
 * Триггер — финансовый индекс (тот же, что на шкале «Мотика»). Когда индекс
 * высокий (по умолчанию >= 85), подушка набрана, долги под контролем, а деньги
 * простаивают — Мотик объедается и «чуть не лопается»: SVG-бегемотик раздувается,
 * рядом пузырь и карточка «Твои накопления спят». Карточка и идея во вкладке
 * «Цели» ведут в отдельный раздел «Разбудить деньги» — спокойный ликбез про
 * инфляцию, варианты (вклад → счёт → облигации → фонды → ИИС), наглядную прикидку
 * роста и кнопку, которая РЕАЛЬНО создаёт цель «Инвесткопилка».
 *
 * indexScore() повторяет формулу индекса из бандла (pl()), чтобы порог совпадал
 * со шкалой. Арифметика и публичные действия — в window.KmInvest.
 *
 * Важно: Мотик будит деньги — он не советует конкретный продукт и не обещает
 * доходность. Все проценты в прикидке — иллюстрация, не гарантия.
 */
(function () {
  "use strict";

  var TRIGGER = 85;     // индекс, с которого Мотик начинает будить накопления
  var BURST   = 92;     // индекс «вот-вот лопну»
  var RATE    = 0.10;   // иллюстративная доходность для прикидки (НЕ обещание)
  var INFL    = 0.08;   // иллюстративная инфляция для прикидки потерь

  // ---------- помощники ----------
  function num(x) { var n = Number(x); return isFinite(n) ? n : 0; }
  // значение сессии/записи в хранилище приходит JSON-кодированным (как пишет приложение через fe)
  function parseMaybe(v) { if (typeof v !== "string") return v; try { return JSON.parse(v); } catch (e) { return v; } }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function money(x) {
    var n = Math.round(num(x)), sign = n < 0 ? "-" : ""; n = Math.abs(n);
    return sign + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "\u00A0") + "\u00A0\u20BD";
  }
  function months(x) { var r = Math.round(num(x) * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }
  function roundTo(x, step) { return Math.max(0, Math.round(num(x) / step) * step); }

  function debtMonthly(p) {
    var d = p && p.debts;
    if (Array.isArray(d) && d.length) return d.reduce(function (s, x) { return s + num(x && x.monthly); }, 0);
    return num(p && p.creditPayments);
  }
  function debtBalance(p) {
    var d = p && p.debts;
    if (Array.isArray(d)) return d.reduce(function (s, x) { return s + num(x && x.balance); }, 0);
    return 0;
  }
  function cushionTarget(p) {

        var t = window.KmDebt.cushionTargetMonths(p);

      }
    } catch (e) {}
    var st = p && p.incomeStability;
    if (st === "unstable") return 6;
    if (st === "variable") return 4;
    return 3;
  }

  // ---------- индекс (копия формулы pl() из бандла) ----------
  function indexScore(profile) {
    var p = profile || {};
    var income = Math.max(num(p.income), 0);
    var mandatory = Math.max(num(p.mandatoryExpenses), 0);
    var payments = Math.max(debtMonthly(p), 0);
    var savings = Math.max(num(p.savings), 0);
    var balance = 0, d = p.debts;
    if (Array.isArray(d)) for (var i = 0; i < d.length; i++) {
      var b = num(d[i] && d[i].balance), mo = num(d[i] && d[i].monthly);
      balance += b > 0 ? b : (mo > 0 ? mo * 18 : 0);     // остаток не указан — оцениваем по платежу
    }
    var obligations = mandatory + payments;                         // обязательные траты + платежи по долгу
    var free = income - obligations;                                // месячный остаток
    var target = p.incomeStability === "unstable" ? 6 : (p.incomeStability === "variable" ? 4 : 3);

    // Устойчивость: денежный поток + запас. Ключевая идея — большой профицит
    // сам по себе защищает, поэтому при доходе, сильно превышающем обязательства,
    // отдельная подушка перестаёт быть обязательной (доход её замещает).
    var margin = income > 0 ? free / income : (free < 0 ? -1 : 0);
    var cashFlow = clamp(margin / 0.25, 0, 1);                      // 0 в ноль, 1 при профиците от 25%
    var cushionMonths = savings / Math.max(obligations, 1);         // на сколько месяцев хватит накоплений
    var cushion = clamp(cushionMonths / target, 0, 1);              // запас относительно цели (3/4/6 мес.)
    var coverage = income / Math.max(obligations, 1);               // во сколько раз доход больше обязательств
    var relief = clamp((coverage - 2) / (12 - 2), 0, 1);            // доход >> трат — подушка уже не нужна
    var buffer = Math.max(cushion, relief);
    var resilience = clamp(0.55 * cashFlow + 0.45 * buffer, 0, 1);

    // Безопасность долга: подъёмность платежей (ПДН) и общая долговая нагрузка.
    var dsr = income > 0 ? payments / income * 100 : (payments > 0 ? 999 : 0);   // ПДН %
    var dti = income > 0 ? balance / (income * 12) : (balance > 0 ? 99 : 0);     // долг / годовой доход
    var payScore = clamp(1 - dsr / 65, 0, 1);
    var levScore = clamp(1 - Math.max(0, dti - 2) / 8, 0, 1);                    // мягко, после 2 годовых доходов
    var debtSafety = 0.65 * payScore + 0.35 * levScore;

    // Итог: ведёт устойчивость, долг весомо влияет. Стабильность дохода и дисциплина
    // трат — мягкие поправки, но они ГАСНУТ по мере роста устойчивости: если человек
    // финансово неуязвим (доход кратно больше обязательств или собрана подушка),
    // эти второстепенные флаги уже не тянут балл вниз. Жизнь «в минус» снижает итог.
    var core = 0.70 * resilience + 0.30 * debtSafety;
    var stabMult = ({ stable: 1, variable: 0.94, unstable: 0.88 }[p.incomeStability]) || 0.94;
    var discMult = 1 - clamp(num(p.impulseLevel) / 3, 0, 1) * 0.12;              // импульсивные траты
    var softMult = stabMult * discMult;
    var effSoft = softMult + (1 - softMult) * resilience;                        // поправки гаснут при высокой устойчивости
    var deficitMult = free >= 0 ? 1 : clamp(1 + free / Math.max(income, 1), 0.4, 1);
    return Math.round(clamp(100 * core * effSoft * deficitMult, 0, 100));
  }

  function metrics(profile) {
    var p = profile || {};

    var pdn = income > 0 ? credit / income * 100 : (credit > 0 ? 999 : 0);
    var target = cushionTarget(p);

  // Будущая стоимость разовой суммы P через years лет под годовую ставку r.

  // Будущая стоимость регулярных взносов C/мес через years лет (помесячная капитализация).

  // ---------- активная вкладка / якоря ----------
  function activeTabText() {
    var on = document.querySelector(".km-tabbar .km-tab.on, .km-tab.on");
    return on ? (on.textContent || "").trim() : "";
  }
  function isMotikTab() {
    if (/Мотик/i.test(activeTabText())) return true;
    var ps = document.querySelectorAll(".km-page p, .km-page .km-muted");
    for (var i = 0; i < ps.length; i++) if (/упитаннее Мотик/i.test(ps[i].textContent || "")) return true;
    return false;
  }
  function isGoalsTab() { return /^Цели$/i.test(activeTabText()); }
  // мы на вкладке «Светофор» (там показан сам индекс)
  function isCreditTab() {
    if (/Светофор/i.test(activeTabText())) return true;
    var hs = document.querySelectorAll("h2.km-display");
    for (var i = 0; i < hs.length; i++) if (/Кредитный светофор/i.test(hs[i].textContent || "")) return true;
    return false;
  }
  // карточка со шкалой индекса (svg-кольцо) — под неё вставляем точку входа
  function creditAnchorCard() {
    var page = document.querySelector(".km-page");
    if (!page) return null;
    var cards = page.querySelectorAll(".km-card");
    for (var i = 0; i < cards.length; i++) {
      var svg = cards[i].querySelector('svg[viewBox="0 0 200 200"]');
      if (svg && svg.querySelector("[stroke-dashoffset],[stroke-dasharray]")) return cards[i];
    }
    return cards.length ? cards[0] : null;
  }

  // мы на вкладке «Главная» (там «Твой диагноз» и сам бегемотик)
  function isHomeTab() {
    if (/Главн/i.test(activeTabText())) return true;
    var hs = document.querySelectorAll("h2.km-display");
    for (var i = 0; i < hs.length; i++) if (/Твой диагноз/i.test(hs[i].textContent || "")) return true;
    return false;
  }
  // якорь на «Главной» — карточка со шкалой индекса (svg-кольцо), советы ставим прямо под ней
  function homeAnchorCard() {
    var page = document.querySelector(".km-page");
    if (!page) return null;
    var cards = page.querySelectorAll(".km-card");
    for (var i = 0; i < cards.length; i++) {
      var svg = cards[i].querySelector('svg[viewBox="0 0 200 200"]');
      if (svg && svg.querySelector("[stroke-dashoffset],[stroke-dasharray]")) return cards[i];
    }
    return null;
  }

  function motikMascotCard() {
    var page = document.querySelector(".km-page");
    if (!page) return null;
    var cards = page.querySelectorAll(".km-card");
    for (var i = 0; i < cards.length; i++) if (cards[i].querySelector('svg[viewBox="0 0 200 200"]')) return cards[i];
    return null;
  }
  // бегемотик = svg без кольца-индикатора (у шкалы есть stroke-dashoffset)
  function hippoSvg(card) {
    if (!card) return null;
    var svgs = card.querySelectorAll("svg");
    for (var i = 0; i < svgs.length; i++) {
      if (!svgs[i].querySelector("[stroke-dashoffset],[stroke-dasharray]")) return svgs[i];
    }
    return svgs.length ? svgs[svgs.length - 1] : null;
  }

  // ---------- «распирание» бегемотика ----------
  var burstEl = null;
  function applyBurst(el, lvl) {
    if (!el) return;
    el.style.transformOrigin = "50% 86%";
    el.style.overflow = "visible";
    el.style.animation = (lvl >= 2 ? "km-inv-burst2 2.4s" : "km-inv-burst1 2.8s") + " ease-in-out infinite";
    if (el.parentElement) el.parentElement.style.overflow = "visible";
    burstEl = el;
  }
  function clearBurst() {
    if (burstEl) {
      try { burstEl.style.animation = ""; burstEl.style.transform = ""; burstEl.style.transformOrigin = ""; } catch (e) {}
    }
    burstEl = null;
  }

  // конкретные советы по инвестициям (на основе метрик)
  function investTips(m) {
    var tips = [];
    tips.push("Подушка на месте \u2014 это главное. Дальше излишек можно спокойно пускать в работу.");
    if (m.idleLump > 0)
      tips.push("Без дела лежит " + money(m.idleLump) + " \u2014 за год это около " + money(inflationLoss(m)) +
        " потерь к инфляции. Перенеси их на вклад или накопительный счёт.");
    if (m.suggestMonthly > 0) {
      var p5 = projection(m, [5])[0];
      tips.push("Откладывай " + money(m.suggestMonthly) + "/мес в фонды или ОФЗ \u2014 за 5 лет это \u2248 " +
        money(p5.grown) + " (иллюстрация при ~" + Math.round(RATE * 100) + "%).");
    }
    tips.push("Не клади всё в одно: раскинь по корзинам \u2014 счёт, вклад, ОФЗ, фонды. Больше доходность \u2014 больше риск.");
    return tips.slice(0, 4);
  }

  // блок «бегемотик даёт советы» на «Главной», рядом с диагнозом
  // пузырь над карточкой советов — свой совет почти для каждого индекса
  function homeBubble(m) {
    var idx = m.index, em, flavor;
    if (idx >= 97) { em = "\uD83E\uDEC3"; flavor = "Уф, я аж растолстел! Индекс " + idx + " \u2014 финансы в шоколаде."; }
    else if (idx >= 92) { em = "\uD83E\uDEC3"; flavor = "Индекс " + idx + " \u2014 я вот-вот лопну от сытости, всё под контролем."; }
    else if (idx >= 88) { em = "\uD83D\uDE0B"; flavor = "Индекс " + idx + " \u2014 я сыт и доволен, подушка набрана."; }
    else { em = "\uD83D\uDE0A"; flavor = "Индекс " + idx + " \u2014 дела идут хорошо, появляется излишек."; }
    var tips = [
      "Лишние деньги пора пристроить \u2014 не давай им таять к инфляции.",
      "Самое время заставить излишек работать на тебя.",
      "Перенеси простаивающие деньги на вклад или накопительный счёт.",
      "Раскинь излишек по корзинам: счёт, вклад, ОФЗ, фонды.",
      "Часть свободного можно увести в фонды \u2014 спокойно и по шагам.",
      "Зафиксируй привычку: фикс-сумма с каждой зарплаты в работу.",
      "Подушку не трогаем \u2014 в работу идёт только излишек."
    ];
    var tip = tips[((idx % tips.length) + tips.length) % tips.length];
    return '<span class="em">' + em + '</span>' + flavor + ' ' + tip;
  }

  function ladderHtml() {
    var steps = [
      { nm: "Накопительный счёт", risk: 1, rl: "тихо", ds: "Процент каждый месяц, деньги под рукой и их можно снять в любой момент." },

      { nm: "Облигации (ОФЗ)", risk: 2, rl: "средне", ds: "Даёшь в долг государству или компании \u2014 платят купоны по графику." },
